# ============================================================
# Catalog of Complexity — Class Entry: earthquake-fault-systems
# Phase 4 entry-drafter output. Third hand-drafted entry; the
# geophysical-solid-earth counterpart to tropical-cyclones (fluid)
# and financial-markets (socio-economic).
# ============================================================
id: earthquake-fault-systems
name: Earthquake fault systems
category: geophysical
status: verified         # promoted 2026-07-02: 4-verifier workflow pass completed, flags fixed or recorded as standing data limitations

exemplars:
  - id: san-andreas-fault
    name: San Andreas Fault (primary)
    note: >
      Primary worked exemplar; the best-studied continental transform fault
      system, carrying nearly all of this entry's citable quantitative
      literature. The Southern San Andreas Fault (SSAF) sub-region — an
      11-section, 602 km stretch defined in Page & Felzer (2015) Table 1 —
      is the specific instrumented population most figures below are drawn
      from.

scoping_note: >
  The system is the fault system as a driven, slip-accommodating structure:
  the network of fault segments and their surrounding seismogenic crustal
  volume, from steady tectonic loading through interseismic strain
  accumulation to episodic coseismic rupture and afterslip. Inside the
  boundary: the fault surface(s), the seismogenic-depth rock volume (~11-20
  km) that stores and releases elastic strain, and the segment-to-segment
  stress-transfer coupling that produces multi-fault ruptures and
  aftershock triggering. Outside: the driving plate-tectonic motion and
  mantle convective heat flow (treated as forcing, not as system dynamics —
  see part_of: plate-tectonics), the non-seismogenic crust and deeper
  lithosphere, and human seismic-monitoring/engineering institutions.
  Atomicity per filling_rules.atomicity-convention: the fault
  segment/patch — a spatially discrete portion of the fault surface capable
  of quasi-independent slip nucleation (per this sweep's recommendation,
  research/phase4/earthquake-fault-systems-sources.md) — NOT individual
  earthquakes (which are events/dynamics generated by the system, not
  structural parts of it) and NOT mineral grains (below the
  characteristic-dynamics scale). Scoring is class-general with SAF/SSAF
  exemplar evidence, per the same class-general-with-named-exemplar pattern
  used by tropical-cyclones.

summary: >
  An earthquake fault system is a slow-charging, catastrophically
  discharging mechanical battery: tectonic plates grind past one another at
  a few centimeters a year, and the fault surfaces separating them lock,
  storing that motion as elastic strain across a network of discrete
  segments until accumulated stress overcomes friction and the surfaces
  slip — sometimes on a single segment, sometimes cascading across several
  in a single rupture. Nothing designs a fault network and nothing
  centrally times its releases; the same magnitude-frequency law
  (Gutenberg-Richter) that describes a small aftershock also describes a
  Fort Tejon-scale rupture, with no privileged scale in between. Its
  signature failure is prediction: the field's own consensus, argued on
  chaos-theoretic grounds, is that individual large-earthquake timing is
  not deterministically forecastable, even though the long-run statistics
  of the population of earthquakes are lawful and well measured.

relations:
  part_of: [plate-tectonics]     # unresolved -> roster expansion queue
  contains: []                   # fault segments are the atomic parts (component_ontology), not sub-entries; no candidate contained complex-systems entries identified

attributes:

  # ---------- GROUP A — IDENTITY & SCALE ----------
  spatial_extent:
    type: quantitative
    level: exemplar(san-andreas-fault)
    value: 1.287e6
    unit: m
    method: >
      Full San Andreas Fault system total length, "more than 800 miles"
      (~1,287 km), per USGS General Interest Publication. The
      well-instrumented Southern San Andreas Fault (SSAF) sub-region,
      carrying most of this entry's quantitative literature, sums to 602 km
      across 11 named sections (Page & Felzer 2015, Table 1: Parkfield,
      Cholame, Carrizo, Big Bend, Mojave North, Mojave South, San
      Bernardino North, San Bernardino South, Mill Creek, Garnet Hill,
      Coachella).
    detail:
      saf_system_total_length: "~1,287 km (>800 mi) — USGS GIP, primary-read"
      ssaf_length_11_sections: "602 km (36+63+59+50+37+98+35+43+56+56+69) — Page & Felzer 2015 Table 1, primary-read"
      seismogenic_depth: "~11-20 km range across studies; ~14-15 km commonly cited for southern SAF specifically; USGS GIP states 'at least 10 miles' (~16 km) — primary-read for the USGS figure, snippet-only/measured-untested for the specific locking-depth literature"
    sources: [usgs-gip-saf, page-felzer-2015]
    evidence_status: measured
    confidence: medium

  characteristic_timescales:
    type: quantitative
    level: exemplar(san-andreas-fault)
    timescales:
      - name: individual rupture duration (M~7.9-scale event)
        value: "~1-2 min (order 1e2 s)"
        measurand: coseismic slip duration, 1857 Fort Tejon-scale rupture
        evidence_status: qualitative
        note: "[unverified — model-knowledge scaling estimate, not independently re-sourced this session; flag for follow-up before decimal-level citation]"
      - name: large-earthquake recurrence interval, southern SAF
        value: "~150 yr (over a documented 1,400-1,500 yr paleoseismic record)"
        measurand: interval between M>=7-class ruptures at a given paleoseismic site
        sources: [usgs-gip-saf]
        evidence_status: measured
        confidence: medium
      - name: SSAF-wide M>=7 recurrence (Biasi & Weldon 2009a)
        value: "63.7 yr average repeat time (rate 0.0157/yr)"
        measurand: SSAF-wide M>=7 nucleation/participation rate, "stringing pearls" paleoseismic reconstruction
        sources: [page-felzer-2015]
        evidence_status: measured
        confidence: medium
      - name: site-level recurrence, Carrizo Plain segment
        value: "~137 yr average, with a documented 272-yr gap"
        measurand: interval between large paleoseismic ruptures at the Carrizo Plain site
        sources: [page-felzer-2015]
        evidence_status: measured
      - name: site-level recurrence, Pallett Creek (Mojave segment)
        value: "~132 yr average, gaps up to ~300 yr"
        measurand: interval between large ruptures at the Pallett Creek site
        sources: [page-felzer-2015]
        evidence_status: measured
      - name: sediment-stratigraphic event-separation resolution
        value: "~20 yr (wet regions) to ~50 yr (dry regions, e.g. Carrizo Plain)"
        measurand: minimum time between events needed for paleoseismic stratigraphic distinguishability
        sources: [page-felzer-2015]
        evidence_status: measured
        note: "a methodological limit, not a system timescale per se, but load-bearing for interpreting the recurrence figures above"
    note: >
      The fastest constituent process (individual rupture, ~minutes) is NOT
      independently verified this session and should not be cited to more
      than order-of-magnitude precision; the recurrence-interval figures ARE
      primary-verified via full-text read of Page & Felzer (2015).

  numerosity:
    type: quantitative
    level: exemplar(san-andreas-fault)
    value: >
      SSAF: 11 named fault sections (primary-read, exemplar level). California
      statewide (UCERF3 framework): >350 fault sections, further subdivided
      into 2,606 or 2,665 subsections depending on fault-model version
      (FM3.1 vs FM3.2) — up from 16 sections in the 1988 WGCEP model and
      ~200 in the 2007 model.
    sources: [page-felzer-2015, usgs-ucerf3-factsheet]
    evidence_status: measured-untested
    confidence: medium
    note: >
      Dominant status reflects the weaker-provenance half of this value: the
      11-section SSAF count is primary-read (exemplar level), but the
      statewide UCERF3 fault-section/subsection counts (>350 sections;
      2,606-2,665 subsections) are measured-untested — the USGS fact sheet
      was located via search but not independently fetched/opened this
      session, though cross-confirmed across multiple independent secondary
      summaries.

      LEVEL NOTE (validator-conformance pass, v0.2 sweep, 2026-07-02): this
      value's headline figure is the exemplar(san-andreas-fault) SSAF
      section count (11, primary-read); level was set to that primary
      attachment. The statewide UCERF3 figures (>350 sections; 2,606-2,665
      subsections) are a class-general-level secondary figure carried in
      the same value string above, not dropped.

  instance_population:
    type: quantitative
    level: class-general
    value: >
      Sharpest scoping ambiguity in this entry (per sweep note): if
      "instances" = discrete EARTHQUAKES (the class's characteristic
      events), California statewide seismicity runs ~500-1,500
      earthquakes/yr overall, ~50-200 felt (M>=3.0)/yr, ~5-10 potentially
      damaging (M>=5.0)/yr; globally ~20,000+ detected/yr (~55/day), ~1
      M>=8.0 event/yr worldwide (standard USGS public figures). If
      "instances" = discrete FAULT SYSTEMS (San Andreas as one instance
      among North Anatolian, Wellington NZ, Dead Sea graben, New Madrid,
      etc. — all named as comparators inside Page & Felzer 2015), no
      citable global inventory count was located.
    sources: [usgs-catalog-stats]
    evidence_status: unknown
    confidence: low
    note: >
      Recorded as a genuine unresolved scoping question rather than forced
      to one reading, per the panel-spec's level-required and no-guessing
      rules; both readings are given so downstream consistency checking can
      adjudicate. Dominant evidence_status (unknown) reflects the
      weaker-provenance "instances = fault systems worldwide" reading (no
      citable global inventory located, not guessed). The alternate
      "instances = earthquakes" reading is measured-untested: event-rate
      figures are snippet-only, standard USGS public figures not
      independently primary-read this session.

  component_ontology:
    type: structured
    level: exemplar(san-andreas-fault)
    note: >
      LEVEL NOTE (validator-conformance pass, v0.2 sweep, 2026-07-02): the
      headline part-count figures below are anchored on the SSAF exemplar
      (~10^2 segments, 11 named sections); level set to that primary
      attachment. The statewide UCERF3 figure (~10^3, 2,606-2,665
      subsections) is a class-general-level secondary figure, carried
      inside parts[0].count_oom below, not dropped.
    parts:
      - name: fault segments/patches
        count_oom: "~10^2 for SSAF alone (11 named sections further subdivided in UCERF3 subsectioning); ~10^3 statewide (2,606-2,665 UCERF3 subsections)"
        interchangeable: no
        itself_complex: no
        note: >
          Segments have distinct slip rates and rupture behaviors (Page &
          Felzer 2015, Table 1) — heterogeneity is load-bearing, not
          incidental. This is the atomicity-convention choice declared in
          the scoping_note: the segment/patch, not the individual
          earthquake (an event/dynamics, not a structural part) and not the
          mineral grain (sub-characteristic-scale).
      - name: seismogenic crustal volume (host rock)
        count_oom: "1 (continuum, not discretely counted) — ~3.86e12 m^3 at the energy_rate_density derivation's assumed 200 m damage-zone width across the full SAF length x 15 km depth"
        interchangeable: "n/a (continuum)"
        itself_complex: no
    confidence: medium

  energy_rate_density:
    type: quantitative
    level: exemplar(san-andreas-fault)
    value: "~3e-5 to ~5e-5"
    unit: erg s^-1 g^-1
    method: >
      DERIVED by this project (evidence_status: derived); no published
      Phi_m value for the San Andreas Fault or fault systems generically
      exists in Chaisson's own tables (confirmed absent per Phase 1's
      exhaustive survey of Chaisson 2011). Derivation chain, every input
      individually flagged: (1) seismic moment-rate M0_rate = mu * A *
      slip_rate, using rigidity mu = 3e10 Pa, fault-plane area A = system
      length (1.287e6 m) x seismogenic depth (1.5e4 m) ~ 1.93e10 m^2, and a
      mid-range geodetic slip rate of 30 mm/yr, gives M0_rate ~ 1.7e19
      N*m/yr. (2) Converting to radiated power via apparent stress
      (sigma_a/mu)*M0 with sigma_a ~1-3 MPa [unverified — model-knowledge
      range, not independently sourced this session] gives ~3e7-6e7 W;
      cross-checked against Kanamori's empirical ratio Es ~ M0/2e4, giving
      ~2.8e7 W (consistent order of magnitude). (3) Mass denominator: SAF
      length x 15 km depth x an assumed fault-zone/damage-zone width of
      ~200 m [unverified — not sourced to a specific fault-zone-width paper
      this session] x crustal density 2,700 kg/m^3 gives volume ~3.86e12
      m^3, mass ~1.0e16 kg. Resulting Phi_m ~3e-5 to ~5e-5 erg/s/g
      (apparent-stress method vs. Kanamori-ratio method).
    detail:
      scec_per_km_moment_rate_crosscheck: >
        A SCEC-affiliated source (central.scec.org/publication/1471, same
        link cited in page-felzer-2015-context) reports a per-km seismic
        moment-accumulation rate of 1.5-1.8e13 N*m/yr per km of fault along
        the Mojave/Carrizo segments, as low as 0.2e13 N*m/yr/km on the San
        Jacinto fault. This is an independent cross-check candidate against
        this derivation's own whole-system moment-rate input (M0_rate ~
        1.7e19 N*m/yr over ~1,287 km implies ~1.3e13 N*m/yr/km
        system-average, consistent in order of magnitude with the Mojave/
        Carrizo figures). [snippet-only/author-unconfirmed — located via
        the same SCEC link already cited in page-felzer-2015-context but
        not independently re-fetched or author-confirmed this session; per
        the sweep's own caveat, treat as a supporting cross-check, not a
        replacement input]
    sources: [page-felzer-2015-context, chaisson2011]
    evidence_status: derived
    confidence: low
    verifier_flags: [unsourced-apparent-stress-input, unsourced-fault-zone-width-input, no-published-Phi_m-exists-for-any-fault-system]
    note: >
      This figure sits many orders of magnitude below Chaisson's published
      benchmarks (Sun ~2, Earth's geosphere ~75, biological/technological
      systems 1e4-1e6+), consistent with tectonic fault systems being an
      extremely slow, low-power-density energy-release process — but this
      COMPARISON is itself derived (ours), not a published claim, and the
      whole figure should be treated as an order-of-magnitude placeholder
      pending a dedicated primary-source seismic-energy-budget study. Each
      input's individual uncertainty (roughly 3x swing from the
      apparent-stress assumption alone) is carried forward rather than
      hidden behind a single point estimate.

  # ---------- GROUP B — STRUCTURE ----------
  interaction_topology:
    type: categorical
    level: class-general
    value: field/continuum
    note: >
      Elastic stress transfer through the crust is the physical mechanism;
      Page & Felzer (2015) explicitly frame the SSAF's interaction with
      other faults as "faults interact as a complex network" (direct quote,
      primary-read, Discussion section) when arguing against the
      characteristic-earthquake model — a network-mediated reading is
      defensible at the segment-interaction level, but the underlying
      physics (elastic stress fields in a continuous crustal medium) is the
      more fundamental description, matching the panel-spec's own framing
      of "elastic stress transfer" as this class's entire interaction
      alphabet.

  interaction_ontology:
    type: structured
    level: class-general
    types:
      - name: elastic stress transfer (Coulomb stress change)
        mechanism: static and dynamic stress redistribution through the surrounding crust following slip on a segment
        participants: fault segments (and the intervening host rock)
        range: local to regional (documented segment-to-segment and cross-fault triggering, e.g. Denali 2002 rupturing three named faults in sequence)
      - name: frictional locking/unlocking (rate-and-state friction)
        mechanism: stress accumulation against a frictional threshold, followed by threshold-triggered slip
        participants: within a single fault segment/patch
        range: local
      - name: aftershock triggering (ETAS-type)
        mechanism: stress perturbation from a mainshock elevating failure probability on nearby patches over a decaying time window
        participants: fault segments and surrounding seismicity
        range: local to regional
    type_count: 3
    alphabet_closure: closed
    justification: >
      Per the panel-spec's own worked note (interaction_ontology
      definition): "elastic stress transfer is the fault system's entire
      alphabet" — every interaction type above reduces to mechanical stress
      redistribution and threshold-triggered frictional failure, fixed by
      rock mechanics and continuum elasticity. No new interaction type can
      arise; this is the class-general closed-alphabet case, directly
      parallel to the tropical-cyclones anchor (fluid dynamics/thermodynamics
      as a closed physical family).

  degree_distribution:
    type: quantitative
    level: class-general
    value: not-applicable
    note: >
      Fault systems are not naturally represented as a discrete node-edge
      network in the standard complex-networks literature (cross-checked
      against Newman 2003's survey, which contains no geophysical/fault-system
      row per Phase 1's quantitative-backbone.md). Some authors (Page &
      Felzer 2015) use "network" metaphorically for multi-fault-rupture
      behavior, but no citable degree-distribution exponent exists. Recorded
      as not-applicable, not unknown, per the column's network-systems-only
      scope — same disposition as tropical-cyclones' continuum-system N/A.

  modularity:
    type: rubric
    level: exemplar(san-andreas-fault)
    score: 2
    justification: >
      Comparator: the modularity anchor scale's Mississippi River basin
      case (score 2) — sub-basins/segments are real, non-arbitrary,
      citable partitions (UCERF3's 11 named SSAF sections, each with
      distinct measured slip rates per Page & Felzer 2015 Table 1) with
      more internal coherence (shared slip history, rupture behavior) than
      cross-segment coupling in the interseismic period. But segments are
      NOT strongly insulated: Coulomb stress transfer routinely couples
      neighbors, and Wesnousky (2008, quoted in Page & Felzer 2015) found
      50% of 28 documented M>=6 ruptures crossed two or more named-fault
      boundaries — substantial cross-module flow during the events that
      matter most. No published modularity Q exists for a fault-segment
      graph; this is a qualitative placement per the hybrid column's
      fallback.
    evidence_status: qualitative

  hierarchy_depth:
    type: quantitative
    level: exemplar(san-andreas-fault)
    value: 3
    unit: organizational levels
    method: >
      Convention (declared per panel-spec): fault patches (atoms) ->
      named fault sections/segments (1; e.g. Parkfield, Carrizo — UCERF3's
      11 SSAF sections) -> multi-segment rupture zones / fault strands (2;
      e.g. the SSAF as a whole, or a "Big Seven" multi-fault rupture
      spanning several named faults) -> the SAF plate-boundary system (3).
      Individual earthquakes are events/dynamics, not aggregation levels
      (consistent with the atomicity-convention exclusion stated in the
      scoping note).
    evidence_status: qualitative

  fractal_dimension_spatial:
    type: quantitative
    level: exemplar(san-andreas-fault)
    value: >
      TENSION RECORDED, NOT MERGED: surface trace D~1.1-1.4 by segment
      (Aviles, Scholz & Boatwright 1987) vs. smooth/planar geometry at
      seismogenic depth (Lomax & Henry 2023) — two different measurands of
      the same fault system.
    unit: dimensionless (D)
    measurand: >
      (a) Aviles et al. 1987: fractal dimension of the mapped SURFACE
      TRACE, via divider/box-counting over a 0.5-1,000 km ruler-size band,
      applied to six segments of distinctive seismic behavior plus three
      branches south of San Bernardino. (b) Lomax & Henry 2023: qualitative
      geometric character of the fault SURFACE AT SEISMOGENIC DEPTH, via
      relocated seismicity (NLL-SSST-coherence method) along major
      California strike-slip faults.
    method: >
      (a) is a quantitative fractal (divider) analysis; (b) is a
      qualitative relocated-hypocenter geometric characterization that does
      NOT report a replacement numerical D.
    detail: >
      Lomax & Henry (2023) find that "relocated seismicity at seismogenic
      depth along major fault segments and around large-earthquake
      ruptures often defines smooth, planar or arcuate, near-vertical
      surfaces" and conclude that surface traces reflect "complex, shallow
      deformation and not directly simpler, main slip surfaces at depth" —
      directly qualifying, not merging with, the classic
      surface-trace-roughness picture. Per filling_rules (the G-R/CSN
      tension is the modeled precedent): record both without silently
      resolving the discrepancy. The surface is fractal; the seismogenic
      depth appears smooth; these are different structures at different
      depths of the same physical fault.
    sources: [aviles1987, lomax-henry2023]
    evidence_status: measured-untested
    confidence: low
    note: >
      Dominant evidence_status (measured-untested) reflects the
      weaker-provenance claim: Aviles et al. 1987's D value was not
      independently re-extracted from the primary paper this session (two
      fetch attempts blocked by 403 on both AGU publisher and ResearchGate
      mirror; existing snippet-verified status maintained, not upgraded).
      Lomax & Henry (2023) is measured — primary-read for the qualitative
      smoothness claim only, no numeric D reported.
    verifier_flags: [aviles1987-full-text-still-inaccessible, genuine-unreconciled-literature-tension]

  decentralization:
    type: rubric
    level: class-general
    score: 4
    justification: >
      Per the decentralization anchor scale's stars case (score 4,
      reasoning directly transferable): no component steers the others.
      Rupture nucleation, propagation, and arrest on any given segment are
      governed entirely by local stress state and frictional physics; there
      is no controller — human seismic-monitoring institutions sit outside
      the scoping boundary and, even where included, cannot control rupture
      timing or extent. Nothing exists whose removal would constitute "loss
      of control," matching the anchor's own test.
    evidence_status: qualitative

  # ---------- GROUP C — DYNAMICS ----------
  nonlinearity:
    type: rubric
    level: exemplar(san-andreas-fault)
    score: 3
    justification: >
      Per this class's own anchor (nonlinearity.yaml): rate-and-state
      friction is intrinsically nonlinear in slip velocity and state
      variable, and segment-to-segment stress transfer is
      multiplicative/threshold-triggered (Coulomb stress changes can
      nonlinearly trigger or suppress rupture on a neighbor). Scored 3
      rather than 4 because interseismic loading — most of the fault
      system's duty cycle — is close to linear elastic strain
      accumulation; nonlinearity concentrates at rupture initiation and
      propagation rather than pervading the full cycle, per the anchor's
      explicit reasoning.
    evidence_status: qualitative

  feedback:
    type: rubric
    level: exemplar(san-andreas-fault)
    score: 1
    loops:
      - name: Coulomb stress transfer
        sign: reinforcing (local, episodic)
        mechanism: "rupture on one segment changes the stress state on neighboring segments, which can trigger or delay rupture there (documented aftershock triggering and segment-to-segment interaction studies)"
    justification: >
      Per this class's own anchor (feedback.yaml): the dominant process —
      steady tectonic loading followed by episodic rupture (elastic
      rebound) — is fundamentally a forced relaxation-oscillator pattern,
      not a feedback loop: plate motion drives strain accumulation largely
      independent of the fault's own stress state, and rupture releases
      stress without looping back to modulate the driving plate motion.
      The one genuine loop (Coulomb stress transfer) is real but local,
      episodic, and peripheral to the primary loading-and-release dynamic —
      scored 1, matching the anchor exactly.
    evidence_status: qualitative

  openness_dissipation:
    type: rubric
    level: exemplar(san-andreas-fault)
    score: 1
    justification: >
      Per this class's own anchor (openness_dissipation.yaml): the system
      is driven by an extremely slow, diffuse flux — Pacific/North
      American relative plate motion (~30-50 mm/yr) [unverified — model
      knowledge for exact plate rate], ultimately sourced from mantle
      convective heat flow (order mW/m^2, among the lowest-power-density
      fluxes in this catalog). Strain accumulates and is released
      episodically rather than continuously dissipated through an
      organized structure the way a hurricane or star does — closer to a
      slowly-charged battery than an active heat engine. Scored 1, not 0,
      because the system is genuinely open to a tectonic energy source over
      geological time.
    evidence_status: qualitative

  chaos_sensitivity:
    type: rubric
    level: exemplar(san-andreas-fault)
    score: 2
    justification: >
      Per this class's own anchor (chaos_sensitivity.yaml): rate-and-state
      friction is nonlinear, and some numerical fault-model studies report
      sensitive dependence on initial stress conditions, underpinning the
      broad scientific rejection of deterministic earthquake prediction
      (Geller et al. 1997, Science 275:1616 — argue earthquakes are
      unpredictable in a manner consistent with sensitive dependence/
      high-dimensional complexity, not just noisy measurement). This is
      model-level and qualitative evidence, not a measured real-fault
      Lyapunov exponent or validated predictability horizon (unlike the
      atmosphere's ~2-week figure) — no numeric predictability-horizon or
      Lyapunov exponent for fault-system dynamics was located this session
      (Geller et al. 1997 itself was only snippet-synthesized, not opened
      as full text). Scored 2: genuine, broadly-accepted unpredictability
      with a plausible mechanism, not rising to model-validated-chaos (3).
    sources: [geller1997]
    evidence_status: qualitative
    verifier_flags: [geller1997-not-opened-as-full-text-snippet-synthesis-only]

  criticality:
    type: hybrid
    level: exemplar(san-andreas-fault)
    score: 2
    mechanism_status: contested
    justification: >
      LEVEL NOTE (validator-conformance pass, v0.2 sweep, 2026-07-02): the
      headline event-statistics figure (Page & Felzer 2015 b-value) is
      exemplar(san-andreas-fault)-level; level set to that primary
      attachment. The mechanism_status: contested verdict (Watkins et al.
      2016 vs. Bak & Tang 1989) is a class-general-level claim about SOC as
      a mechanism for fault systems generally, not SSAF-specific — carried
      as a secondary attachment within this same block, not dropped.

      Per this class's own anchor (criticality.yaml) and per
      filling_rules.soc-two-claims: (a) Event statistics: Gutenberg-Richter
      magnitude-frequency scaling is SOLID — this sweep upgrades the
      b-value citation to primary-read: Page & Felzer (2015) report b =
      1.03 +/- 0.12 (M>=2.5, within 20 km of SSAF, UCERF3 catalog,
      maximum-likelihood method), consistent with the statewide b=1.0
      (Hutton et al. 2010; used by UCERF3/Field et al. 2014) and b=0.95
      (Tormann et al. 2010) (evidence_status: measured). (b) Mechanism:
      Bak & Tang (1989) proposed earthquake faults as the SOC archetype,
      but Watkins et al. (2016) document the interpretation as contested —
      sandpile-type models (Olami-Feder-Christensen) fail to correctly
      represent elastic stress transfer, and some analyses find real
      seismicity off the exact critical point. Per soc-two-claims: solid
      event statistics, contested mechanism, not averaged upward — matches
      the anchor's own score exactly. Additional SOC-adjacent (but still
      non-dispositive) supporting context, both quoted within Page & Felzer
      (2015)'s own citation list rather than independently fetched this
      session: Parsons (2007) reports a "fractal fault complexity"
      power-law relationship among seismicity clusters and gaps along the
      whole San Andreas Fault; Marone (1998) documents a fault-strength
      rate-and-state healing mechanism relevant to the stress-restoration
      side of the loading-and-release cycle. Neither finding resolves the
      contested-mechanism verdict above; both are consistent in kind with
      the SOC-adjacent reading without independently confirming it.
    sources: [page-felzer-2015, watkins2016]
    evidence_status: measured

  extreme_event_statistics:
    type: quantitative
    level: exemplar(san-andreas-fault)
    measurand_type: temporal-event
    value: >
      G-R b-value (magnitude-frequency slope): 1.03 +/- 0.12 (SSAF, M>=2.5,
      within 20 km, UCERF3 catalog) — consistent with statewide b=1.0
      (UCERF3/Field et al. 2014, Hutton et al. 2010) and b=0.95 (Tormann et
      al. 2010), range 0.95-1.16 across independent studies. SEPARATELY:
      CSN 2009 formally REJECTED the raw California-earthquake-AMPLITUDE
      power law (a distinct measurand): alpha=1.64(4), goodness-of-fit
      p=0.00.
    measurand: >
      Two distinct measurands, per filling_rules.power-law-rigor and
      soc-two-claims — must not be merged: (1) event MAGNITUDE
      log-linear frequency count (the G-R b-value); (2) event
      AMPLITUDE/intensity distribution tested via CSN's MLE + KS-test +
      bootstrap protocol.
    method: >
      G-R b-value: maximum-likelihood estimation (Aki 1965; Shi & Bolt
      1982), fit to the post-recalibration UCERF3 seismicity catalog.
      CSN rejection: MLE + goodness-of-fit + comparison-to-alternatives
      protocol (Clauset, Shalizi & Newman 2009) applied to raw
      earthquake-amplitude data.
    sources: [page-felzer-2015, csn2009]
    evidence_status: measured
    confidence: high
    note: >
      Do not resolve this tension silently, per the panel-spec's own note:
      "CA earthquake sizes formally rejected (raw form) while G-R b~1.0
      stands in magnitude — record the tension, don't resolve it
      silently." Additionally, Page & Felzer (2015)'s central finding
      is that unbroken G-R magnitude scaling holds even where the older
      "characteristic earthquake" hypothesis (Wesnousky et al. 1983;
      Schwartz & Coppersmith 1984) predicted a high-magnitude break — a
      third, related claim this entry's primary source explicitly
      adjudicates in favor of unbroken G-R for the SSAF. Both component
      claims share evidence_status: measured — G-R b-value is a
      well-replicated, uncontested magnitude-frequency slope (the
      strongest-provenance figure in this entry, primary-read full text);
      the CSN amplitude-power-law rejection is for its own distinct
      dataset (also primary-read, reused from Phase 1).

      LEVEL NOTE (validator-conformance pass, v0.2 sweep, 2026-07-02): the
      headline value (G-R b-value) is exemplar(san-andreas-fault)-level;
      level set to that primary attachment. The CSN 2009
      California-earthquake-amplitude rejection is a class-general-level
      comparator claim (California statewide, not SSAF-specific),
      carried as the "SEPARATELY" clause in the value field above, not
      dropped.

      MEASURAND_TYPE NOTE (validator-conformance pass, v0.2 sweep,
      2026-07-02): temporal-event — both component measurands (G-R
      magnitude-frequency slope; CSN raw-amplitude power-law fit) are
      event-size/frequency distributions of discrete earthquake events
      over time, not a static rank-size cross-section.

  temporal_correlation:
    type: quantitative
    level: exemplar(san-andreas-fault)
    value: >
      No formal Hurst exponent or long-range-correlation statistic located
      (unknown). Qualitative/simulation-based clustering evidence IS
      available: median 30-day SSAF seismicity rate is only 52% of the
      long-term mean; 1-year median 59%; 10-year median 72%; even 100-year
      windows show a median at 93% of the mean with "anomalously slow,
      non-Gaussian convergence" (ETAS modeling, citing Naylor, Main &
      Touati 2009).
    measurand: SSAF seismicity rate (event count per unit time), ETAS-simulated (Ogata 1988)
    sources: [page-felzer-2015]
    evidence_status: measured
    confidence: medium
    note: >
      EVIDENCE_STATUS NOTE (validator-conformance pass, v0.2 sweep,
      2026-07-02): evidence_status set to the single enum fitting the
      headline value — measured (simulation-based rate-clustering
      evidence, primary-read within Page & Felzer 2015). The secondary
      claim (no formal Hurst exponent or long-range-correlation statistic
      for fault seismicity was located this session) is recorded in the
      value field above as "unknown," not guessed, but does not override
      the block-level evidence_status for the data that IS present.

      Global comparator clustering evidence (all primary-read within Page &
      Felzer 2015, all with their own citations): North Anatolian Fault
      clustering (Ambraseys 1970; Hartleb et al. 2006); Dead Sea graben,
      0-8 events per 5,000-yr window (Marco et al. 1996); Wellington Fault
      NZ slip-rate variation >10x over time (Ninis et al. 2013); Bear
      Valley creeping-section swarm of 77 M>=4 events in 1970-1975 alone.

  tipping_transitions:
    type: hybrid
    level: exemplar(san-andreas-fault)
    score: 1
    justification: >
      Per this class's own anchor (tipping_transitions.yaml): no
      systematic inventory of tipping elements analogous to the climate
      literature (Armstrong McKay 2022) exists for fault systems.
      Individual earthquakes are discrete stress-release events on a
      driven system, not documented alternative-stable-state transitions.
      Exploratory critical-slowing-down-style precursor work exists but
      sits adjacent to the deterministic earthquake-prediction literature
      that Geller et al. (1997) showed unreliable — per the anchor's
      does_not_count clause, this is explicitly NOT credited as
      established evidence. Scored 1: informal "the fault is due for a big
      one" tipping-adjacent public discourse exists, no formal regime-shift
      inventory or confirmed bifurcation structure — matches the anchor
      exactly.
    sources: [geller1997]
    evidence_status: qualitative

  # ---------- GROUP D — INFORMATION & MEMORY ----------
  memory_hysteresis:
    type: hybrid
    level: exemplar(san-andreas-fault)
    score: 2
    justification: >
      Per this class's own anchor (memory_hysteresis.yaml): fault strength
      and rupture behavior at a given segment depend on accumulated
      slip-deficit and the specific history of prior ruptures (stress
      shadows, segment "unzipping" order) — genuine path-dependence; the
      same tectonic loading rate does not guarantee the same next-earthquake
      location or timing. Capped below 3 because no published
      hysteresis-loop measurement exists (no loading-vs-slip curve with a
      documented loop width) — the evidence is qualitative stress-transfer
      modeling (Coulomb stress-change studies), not a quantified hysteresis
      metric. Matches the anchor exactly.
    evidence_status: qualitative

  information_processing:
    type: rubric
    level: exemplar(san-andreas-fault)
    score: 1
    justification: >
      Per this class's own anchor (information_processing.yaml — the
      panel-spec's explicitly expected low-score case): rupture initiates
      when local shear stress exceeds the rate-and-state frictional
      strength threshold — a physical threshold trigger, not detection in
      any representational sense; no channel carries a signal
      distinguishable from the stress itself, and static/dynamic stress
      transfer to neighboring segments is the same physical-propagation
      story as radiative transport in a star, just via elastic waves and
      Coulomb stress change. Scored 1, not 0, because the rate-and-state
      threshold is at least a discrete trigger/comparison against a
      reference friction value (the scale's level-1 definition); still far
      below anything resembling signaling. Matches the anchor exactly.
    evidence_status: qualitative

  # ---------- GROUP E — ADAPTATION ----------
  adaptive_capacity:
    type: rubric
    level: exemplar(san-andreas-fault)
    score: 0
    justification: >
      Comparator: the adaptive_capacity anchor scale's stars case (score 0)
      and planetary-climate case (score 0) — both scored 0 despite rich
      feedback/memory elsewhere in their panels, which is exactly the CAS/
      non-CAS discriminator this column is built to surface. Fault-segment
      behavior is fixed by rock mechanics and rate-and-state friction
      constitutive laws; nothing in the fault system modifies its response
      function in light of history. The Coulomb-stress feedback loop
      (feedback column) and the path-dependent stress-shadow memory
      (memory_hysteresis) both operate without any component "learning" —
      they are regulation and memory, not adaptation, per this column's
      does_not_count clause. Scored 0, matching the Sun/climate floor
      anchors and the panel-spec's own explicit expectation that fault
      systems score at or near 0 here.
    evidence_status: qualitative

  variation_selection:
    type: categorical
    level: class-general
    value: absent
    justification: >
      No variation-selection-retention dynamics among fault segments or
      any other system component; segment behavior (slip rate, rupture
      style) is set by fixed geological/frictional properties, not by a
      selection process acting on variant behaviors.

  # ---------- GROUP F — EMERGENCE & ROBUSTNESS ----------
  emergence:
    type: rubric
    level: class-general
    score: 2
    justification: >
      Comparator: the emergence anchor scale's stars case (score 2) is the
      closest match. The Gutenberg-Richter magnitude-frequency relation
      (b-value) is a real, quantitatively formalized macro-law used
      predictively/explanatorily by seismology (a genuine order parameter
      in the scale's sense), which would argue for 3; but unlike
      tropical-cyclones' potential-intensity theory or NYSE's price, the
      G-R law describes the STATISTICAL POPULATION of events, not a
      single coherent macro-state of "the fault system" as an individual
      object the way a storm's minimum pressure or a market's price does —
      it is closer to the Sun's dynamo/activity-cycle effective theory
      (real but with debated independent quantitative content at the
      level of any one segment) than to a field-defining, individual-system
      order parameter. Scored 2: a formalized statistical macro-law exists
      and is genuinely load-bearing for the field, but it characterizes the
      population of events rather than a single emergent macro-state of one
      fault system, holding this below the tropical-cyclones/NYSE level-3/4
      cases.
    sources: [page-felzer-2015]
    evidence_status: qualitative

  self_organization:
    type: rubric
    level: exemplar(san-andreas-fault)
    score: 3
    justification: >
      Comparator: the self_organization anchor scale's tropical-cyclones
      and river-networks cases (both score 4) are close but not exact
      matches. Fault segmentation, the Gutenberg-Richter scaling relation,
      and multi-fault rupture patterns all emerge from local
      stress-transfer and frictional-failure dynamics over geological
      time, with no external template specifying rupture size, location,
      or timing — directly parallel to the river-network anchor's
      erosion-flow feedback producing Horton's laws with no template.
      Held at 3 rather than 4 because the fault GEOMETRY itself (segment
      locations, fault trace) is substantially set by pre-existing
      crustal heterogeneity and plate-boundary geometry — a partial
      external constraint on the "canvas" the self-organizing rupture
      dynamics play out on, unlike a hurricane's essentially unconstrained
      atmospheric medium or a river basin's more purely self-carved
      network. Tectonic forcing (plate motion) powers but does not
      template the order, per the does_not_count clause.
    evidence_status: qualitative

  robustness_resilience:
    type: rubric
    level: exemplar(san-andreas-fault)
    score: 3
    justification: >
      Comparator: the robustness_resilience anchor scale's the-internet
      case (score 3) is the closest match, adapted with a geological
      lifetime lens per the column's normalization rule (robustness judged
      against the system's OWN characteristic perturbation spectrum and
      lifetime). The SAF system has persisted and continued generating its
      characteristic magnitude-frequency behavior across millions of years
      and hundreds of documented large ruptures (the ~1,400-1,500 yr
      paleoseismic record alone spans ~10 M>=7 cycles) — individual
      ruptures are "scars" (redistributed stress, changed segment timing)
      rather than identity loss of the fault system as a whole; the system
      absorbs its characteristic perturbation (large earthquakes) by
      design of its own dynamics, recovering to generate the same
      statistical behavior. Held at 3, not 4: known event classes (a
      throughgoing multi-segment "Big One" rupture, or geological-timescale
      fault-geometry reorganization) do meaningfully alter individual
      segment behavior and stress state for decades, a real degradation
      within the system's own operating spectrum, consistent with the
      anchor's 3-vs-4 distinction (known destructive event classes exist).
    evidence_status: qualitative

  cascade_susceptibility:
    type: hybrid
    level: exemplar(san-andreas-fault)
    score: 2
    justification: >
      LEVEL NOTE (validator-conformance pass, v0.2 sweep, 2026-07-02): this
      score is applied at the SAF/SSAF exemplar level; level set to that
      primary attachment. The underlying case-count statistics (Wesnousky
      2008's 28 California ruptures; the "Big Seven" of Haeussler et al.
      2004) are class-general in scope — they span California AND Alaska
      strike-slip fault systems generally, not the San Andreas alone — and
      are used here as the best available comparator evidence for scoring
      this exemplar, per the same class-general-with-named-exemplar
      pattern used throughout this entry.

      Per this class's own anchor comparator — the cascade_susceptibility
      scale's financial-markets case (score 2) is the closest match: at
      least one dedicated systematic compilation documents cascading
      rupture with characterized rough extent, but no fitted cross-event
      cascade-SIZE distribution exists. Specifically (primary-read from
      Page & Felzer 2015, quoting Wesnousky 2008): of 28 documented
      surface-rupturing M>=6 earthquakes, 14 (50%) involved two or more
      separately named faults; of the remaining 14, 10 (70%) clearly
      involved rupture of multiple geologically distinct fault segments.
      Of the "Big Seven" (seven M>7.8 continental strike-slip earthquakes
      since 1900, Haeussler et al. 2004), 4 of 7 involved rupture on a
      fault other than the main strike-slip strand (Denali 2002: nucleated
      on the previously unknown Susitna Glacier fault, ruptured ~200 km of
      the Denali fault, continued ~100 km on the Totschunda fault). These
      are systematic, citable case counts (level 2: cascades occur, rough
      extent characterized) but not a fitted power-law-style cascade-size
      distribution comparable to the blackout literature (level 3), so
      this stops at 2.
    sources: [page-felzer-2015]
    evidence_status: measured
    confidence: medium

emergent_phenomena:
  - name: Gutenberg-Richter magnitude-frequency scaling
    order_parameter: b-value (log-linear slope of event count vs. magnitude)
  - name: Multi-fault cascading rupture
    order_parameter: number/identity of named faults involved in a single rupture (Wesnousky 2008 case-count statistic)
  - name: Seismicity-rate clustering (aftershock sequences)
    order_parameter: time-varying seismicity rate relative to long-term mean (ETAS-modeled)
  - name: Segment-scale recurrence behavior
    order_parameter: paleoseismic recurrence interval at a given site (Carrizo Plain, Pallett Creek)

sources:
  page-felzer-2015:
    citation: >
      Page, M. & Felzer, K. (2015). Southern San Andreas Fault Seismicity
      is Consistent with the Gutenberg-Richter Magnitude-Frequency
      Distribution. Bulletin of the Seismological Society of America
      105(4). doi:10.1785/0120140340. [primary-read in full this session —
      full PDF text fetched and read directly; the single best-anchored
      quantitative source for this entry, covering b-value, recurrence
      intervals, fault-segment structure, multi-fault rupture statistics,
      and ETAS clustering. Contains quoted/relayed figures from: Hutton,
      K.L., Woessner, J. & Hauksson, E. (2010), BSSA 100, 423-446;
      Tormann, T., Wiemer, S. & Hauksson, E. (2010), BSSA 100, 1733-1742,
      doi:10.1785/0120090124; Field, E.H. et al. (2014), UCERF3, BSSA 104,
      1122-1180, doi:10.1785/0120130164; Biasi, G.P. & Weldon, R.J.
      (2009a), Seismol. Res. Lett. 80, 381; Akçiz et al. (2009), JGR 114,
      doi:10.1029/2007JB005285; Sieh, Stuiver & Brillinger (1989), JGR 94,
      603-623; Naylor, Main & Touati (2009), JGR 114,
      doi:10.1029/2008JB005870; Wesnousky, S.G. (2008), BSSA 98,
      1609-1632; Haeussler, P.J. et al. (2004), BSSA 94, S23-S52; Aki, K.
      (1965), Bull. Earthq. Res. Inst. 43, 237-239; Shi, Y. & Bolt, B.A.
      (1982), BSSA 72, 1677-1687; Parsons, T. (2007), Nat. Geosci. 1,
      59-63 — all quoted-within-primary, not independently fetched as
      their own primary sources this session.]
  usgs-gip-saf:
    citation: >
      USGS General Interest Publication, "The San Andreas Fault."
      https://pubs.usgs.gov/gip/earthq3/safaultgip.html. [primary-read,
      fetched directly this session; a general-public federal-agency
      source, not peer-reviewed, but the responsible agency's own figure
      for system length and depth]
  usgs-ucerf3-factsheet:
    citation: >
      USGS/SCEC UCERF3 summary materials (pubs.usgs.gov/fs/2015/3009) —
      statewide fault-section and subsection counts. [snippet-only —
      located via search, not independently fetched/opened this session;
      figures cross-confirmed across multiple independent secondary
      UCERF3-summary sources]
  usgs-catalog-stats:
    citation: >
      USGS historical earthquake-catalog statistics (California and global
      annual event-rate figures, "about 55 per day" worldwide, ~1 M>=8.0/yr
      average). [snippet-only, standard USGS public figures, not
      independently primary-read as a single source this session]
  csn2009:
    citation: >
      Clauset, A., Shalizi, C.R. & Newman, M.E.J. (2009). Power-law
      distributions in empirical data. SIAM Review 51(4), 661. [primary-read
      in Phase 1, reused here — source of the CSN power-law-rigor standard
      and the California-earthquake-amplitude rejection, alpha=1.64(4),
      p=0.00]
  watkins2016:
    citation: >
      Watkins, N.W., Pruessner, G., Chapman, S.C., Crosby, N.B. & Jensen,
      H.J. (2016). 25 Years of Self-Organized Criticality: Concepts and
      Controversies. Space Science Reviews 198, 3-44.
      doi:10.1007/s11214-015-0155-x (also arXiv:1504.04991). [primary-read
      in Phase 1, reused here — the SOC-mechanism-contested anchor]
  geller1997:
    citation: >
      Geller, R.J., Jackson, D.D., Kagan, Y.Y. & Mulargia, F. (1997).
      Earthquakes Cannot Be Predicted. Science 275(5306), 1616-1617.
      doi:10.1126/science.275.5306.1616. [snippet-only this session —
      confirmed via search-engine synthesis, NOT independently fetched as
      full text; the chaos/unpredictability anchor for this entry;
      recommend a follow-up primary-read pass before further lock-in. A
      companion citation, Geller, R.J. (1997), "Earthquake prediction: a
      critical review," Geophysical Journal International 131(3), 425-450,
      was also located but not opened]
  aviles1987:
    citation: >
      Aviles, C.A., Scholz, C.H. & Boatwright, J. (1987). Fractal Analysis
      Applied to Characteristic Segments of the San Andreas Fault. Journal
      of Geophysical Research 92(B1), 331-344.
      doi:10.1029/JB092iB01p00331. [snippet-verified only — direct fetch of
      the AGU publisher page returned HTTP 403 (paywall); a ResearchGate
      mirror also returned 403, both blocked twice this session. Per-segment
      D values (commonly cited elsewhere as ~D=1.0-1.3) were NOT
      independently re-extracted from the primary paper this session]
  lomax-henry2023:
    citation: >
      Lomax, A. & Henry, P. (2023). Major California faults are smooth
      across multiple scales at seismogenic depth. Seismica 2(1), article
      324. doi:10.26443/seismica.v2i1.324. [primary-read (full abstract
      fetched directly) this session — new find, qualifies the classic
      Aviles et al. fractal-roughness picture with a depth-vs-surface-trace
      distinction]
  chaisson2011:
    citation: >
      Chaisson, E. (2011). Energy Rate Density as a Complexity Metric and
      Evolutionary Driver. Complexity 16(3), 27. [Phase 1 survey confirmed
      Chaisson's own tables contain no geophysical-fault-system Phi_m
