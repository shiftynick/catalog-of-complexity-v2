  mehling2024:
    citation: >
      Mehling, O., Börner, R., & Lucarini, V. (2024). Limits to
      predictability of the asymptotic state of the Atlantic Meridional
      Overturning Circulation in a conceptual climate model. Physica D:
      Nonlinear Phenomena 459, 134043. arXiv:2308.16251. [primary abstract
      read this sweep via WebFetch of the arXiv abstract page; full-text
