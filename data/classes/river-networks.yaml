  newman2003:
    citation: "Newman, M.E.J. (2003). The structure and function of complex networks. SIAM Review 45(2), 167-256. [project-wide source, reused as baseline for the tree-topology/degree_distribution scoping argument] [read-status (validator-conformance pass, v0.2 sweep, 2026-07-02): primary-read — 'Full text and Table II retrieved and read' in Phase 1 (research/phase1/quantitative-backbone.md, section 6), which explicitly confirms Table II contains no river/hydrological network row ('Sun, Katrina, San Andreas, Mississippi, NYC: not present — these are not represented as networks in this classic table'). research/phase4/river-networks-sources.md item 5 confirms this river-networks entry reuses that project-wide primary read as the baseline scoping citation for why river networks fall outside degree_distribution's applicable scope, and was 'not independently re-read in this sweep' beyond that reuse.]"
  mississippi-usgs-wikipedia:
