    - column: hierarchy_depth
      note: >
        RESOLVED 2026-07-02 per cross-audit finding: the column previously
        used Strahler stream order (10) as the level-counting convention,
        a different measurand (literal physical branching order) than the
        aggregation-tier convention (levels above the declared atomic part)
        used by the other nine pilot entries, making it non-commensurable
        for cross-entry comparison despite being a principled choice for
        this class specifically. Fixed by recording the aggregation-tier
        value (3: channel links -> sub-basins -> major tributary basins ->
        whole network) as the column's primary value, matching
        tropical-cyclones and financial-markets' convention, and moving
        Strahler order (10) to a clearly-labeled detail.strahler_stream_order
        field so the physical-branching-order fact is retained without
        contaminating the cross-entry column.
