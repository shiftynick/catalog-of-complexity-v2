    - column: extreme_event_statistics
      note: >
        Zipf alpha-hat=2.37(8) is CSN-rated "moderate," not "good" — it must
        not be read or cited elsewhere in this catalog as a confirmed clean
        power law for city sizes. The tension between CSN's pdf-exponent
        convention (~2.37) and the classic Zipf/Auerbach rank-size convention
        (~1, a different but related quantity) is recorded but the historical
        claim itself was not independently re-verified against primary Zipf
        (1949)/Auerbach (1913) texts.
    - column: degree_distribution
      note: "No intra-urban network (street, transit, mobility-flow) degree-distribution exponent for NYC or Tokyo specifically was recovered; candidate source Louf, Roth & Barthelemy (2014) flagged but not read."
    - column: modularity
