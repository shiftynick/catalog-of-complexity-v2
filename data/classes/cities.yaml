    - column: temporal_correlation
      note: "Traffic hysteresis (MFD loading/unloading loops) is qualitatively confirmed in the literature but no numeric loop-magnitude or Hurst-exponent figure for any NYC/Tokyo signal was recovered; left unknown rather than stretched into a false quantitative figure."
    - column: energy_rate_density
      note: >
        The body-mass-vs-infrastructure-mass normalization convention is
        genuinely ambiguous for a city (unlike a hurricane or a human body);
        the recorded derived Phi_m uses body mass only, by necessity (no
        infrastructure-mass figure exists), and this should not be read as
        directly comparable to Chaisson's own per-person "technologists"
        figure without the caveat carried in the method field.
