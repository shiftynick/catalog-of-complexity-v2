provenance:
  drafted_by: workflow-agent (2026-07-02)
  scoping_and_rubrics: workflow-agent hand-build, v0.2 expansion, reusing tropical-cyclones/planetary-climate anchor reasoning per task instructions at every rubric column (nonlinearity, decentralization, information_processing, adaptive_capacity, self_organization, cascade_susceptibility, memory_hysteresis, robustness_resilience, modularity all carry direct comparator justifications to the adjacent nested-system entries)
  verification:
    citation_check: pending
    plausibility_check: pending
    consistency_check: pending
    coverage_check: pending
  flags:   # this agent's own top uncertainties, per task instructions
    - column: numerosity
      note: >
        Neu et al. (2013)'s own headline finding is that 15 standard
        algorithms applied to identical ERA-Interim input disagree by
        roughly a factor of 3-5 on total NH extratropical-cyclone counts
        (6,000-21,000 winter tracks over 20 years, depending on method).
        This is recorded as an explicit range with the method-uncertainty
        named, per the sweep's own recommendation, rather than collapsed
        to a misleading point estimate — but it means this entry's
        numerosity column is genuinely less clean than tropical-cyclones'
        ~85/yr WMO figure, a real (not merely presentational) cross-entry
        commensurability contrast worth flagging for the analysis layer.
    - column: criticality
      note: >
        The Peters & Neelin (2006) citation is a reassignment, not a
        purpose-built weather-systems study: it is rigorous and
        primary-read, but concerns general tropical atmospheric
        convection/precipitation over ocean basins (TRMM data), not
        extratropical cyclones, monsoons, or atmospheric rivers
        specifically — its data sit close to the tropical-cyclone boundary
        this entry's own scoping note explicitly excludes. The orchestrator
        scoping call recorded it here (as a weather-system-scale mesoscale-
        convective-organization phenomenon, connected to this entry's own
        MCC component) rather than deferring to a hypothetical separate
        "tropical convection" entry; this remains a standing scoping
        judgment call for the next revision, not a settled fact.
    - column: energy_rate_density
      note: >
        No published power/mass figure for extratropical cyclones,
        monsoons, or atmospheric rivers as a class was found this sweep —
        a genuine literature gap, not an under-search. Tropical-cyclones'
