  lorenz-cycle-reanalysis:
    citation: "Convergent reanalysis-based estimates of the global atmospheric Lorenz energy cycle's kinetic-energy dissipation rate (~1.93-2.61 W/m^2 global-mean, multiple independent studies including an ERA-Interim-based multi-decadal trend estimate ~1.93->2.11 W/m^2 over 1979-2013), identified via WebSearch this fix pass (flag-fixer, 2026-07-02). Candidate primary source flagged but NOT fetched this session: Peixoto, J.P. & Oort, A.H. (1992). Physics of Climate. American Institute of Physics — the general-circulation energy-budget textbook already named as a follow-up lead in this entry's own provenance.flags. [WebSearch-convergent secondary characterization of reanalysis literature only this fix pass; flagged for a dedicated primary-read pass (Peixoto & Oort 1992 directly, or one of the underlying reanalysis papers) before promotion past draft]"
