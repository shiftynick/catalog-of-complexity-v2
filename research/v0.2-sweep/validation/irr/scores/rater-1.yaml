rater: 1
model: haiku
entries:
  stars:
    decentralization: {score: 4, confidence: high, note: "Continuous plasma/field system with no privileged controller. Calibrated against feedback scale's description of systems with no external steering authority."}
    modularity: {score: 0, confidence: high, note: "Continuum system with no internal boundaries or subdivision. Radiative/convective zones are gradient-layers, not modular compartments; no within-group vs. between-group density difference."}
    hierarchy_depth: {score: 3, confidence: high, note: "Nested layers: core-radiative-convective-photosphere-chromosphere-corona (~6 levels). More than a simple hierarchy but limited functional nesting; calibrated against planetary-climate anchor's complexity."}
    feedback: {score: 3, confidence: high, note: "Multiple feedback loops: convective efficiency (temperature -> convection -> energy transport), radiation-pressure feedback on shell dynamics, magnetic-field-plasma coupling loops. Continuously active, structurally central (convection patterns depend on loops)."}
    nonlinearity: {score: 3, confidence: medium, note: "Nonlinear MHD equations, nonlinear radiative transfer, convective instability. Core dynamics depend on nonlinearity, but concentrated in specific zones (convective core, photosphere) rather than pervasive at all scales."}
    self_organization: {score: 4, confidence: high, note: "Granulation patterns, sunspot emergence, and magnetic-field topology self-organize spontaneously from turbulent plasma dynamics. No external template for surface morphology; canonical dissipative-structure example."}
    emergence: {score: 3, confidence: medium, note: "Rayleigh number, Nusselt number, and solar-cycle order parameters are formalized macro-descriptions in stellar-physics literature. Sunspot cycles require macro-level dynamo theory, not just micro-dynamics."}
    memory_hysteresis: {score: 2, confidence: medium, note: "Solar-cycle magnetic-flux reversals show path-dependence over 11-yr cycles (Gleissberg variation, Maunder minimum history). No quantified hysteresis-width measurement, so capped below 3. Calibrated against San Andreas anchor (qualitative path-dependence without hysteresis loop)."}
    information_processing: {score: 0, confidence: high, note: "Radiative transport and convective flows are pure energy/momentum transfer with no detection or signal channel. No state-dependent response beyond direct forced propagation. Anchor example: heat conduction/radiative diffusion score 0."}
    adaptive_capacity: {score: 0, confidence: high, note: "Physics-fixed responses; no component alters its behavior through experience. Feedbacks operate, they do not learn. Identical to planetary-climate anchor rationale."}
    criticality: {score: 1, confidence: medium, note: "Solar flare size distributions informally discussed but no CSN-2009-grade statistical power-law fit published. Heavy-tailed events claimed but not rigorously established; capped at 1 per anchor scale definition."}
    tipping_transitions: {score: 0, confidence: high, note: "Main-sequence evolution is smooth across 10-Gyr timescale; no documented bifurcation or regime-shift mechanisms. Stellar type transitions (subgiant, red giant) are outside the entry's scoping boundary."}
    chaos_sensitivity: {score: 2, confidence: medium, note: "Interior convection/dynamo exhibit sensitive dependence in model studies, but no quantified real-sun Lyapunov exponent or operational predictability horizon. Model-level evidence without real-system measurement; anchored to earthquake anchor (qualitative unpredictability, score 2)."}
    openness_dissipation: {score: 4, confidence: high, note: "Star is the textbook dissipative structure: 386 billion megawatt nuclear energy throughput, continuously dissipated as radiation and wind. Interruption (gravitational collapse) instantly destroys organization. Equivalent to hurricane anchor."}
    robustness_resilience: {score: 4, confidence: high, note: "Maintains hydrogen-fusion structure and interior circulation across billions of years despite constant extreme internal flux and violent surface activity. Perturbations (sunspots, flares) are routine; structure persists. Normalized for its 10-Gyr timescale."}
    cascade_susceptibility: {score: 0, confidence: high, note: "No network topology to cascade through; no failure-propagation literature. Flare cascades are local plasma phenomena, not network-cascade in the grid/system sense."}

  river-networks:
    decentralization: {score: 4, confidence: high, note: "Drainage network emerges from distributed erosion-deposition processes. No central coordinator; topography and physics entirely determine flow geometry. No steering authority."}
    modularity: {score: 2, confidence: medium, note: "Tributary confluence clusters create recognizable subunits (sub-basins), but flow is continuous across boundaries and boundaries shift over time. Confluence structure has within-tributary coupling > between-tributary coupling, but not strongly insulated (score 2, not 3)."}
    hierarchy_depth: {score: 3, confidence: high, note: "Strahler ordering creates ~8-10 nested levels from headwater creeks to mainstem. Multiple functional hierarchy levels. Calibrated against feedback scale's nested-system examples."}
    feedback: {score: 3, confidence: high, note: "Dominant loops: (1) Stream-power feedback [REINFORCING]: velocity increases -> bed shear stress increases -> more erosion -> steeper slope -> faster flow. (2) Meander-migration feedback [REINFORCING/BALANCING]: outer-bank erosion -> channel migration -> sediment deposition -> loop. Continuously active, explain observed channel morphology."}
    nonlinearity: {score: 3, confidence: high, note: "Stream power law (discharge raised to power >2) is intrinsically nonlinear; bedload transport follows nonlinear rating curves. Nonlinearity required to explain observed channel geometry and downstream hydraulic geometry changes; calibrated against tropical-cyclone anchor (central to characteristic dynamics)."}
    self_organization: {score: 4, confidence: high, note: "Horton's laws, Strahler ordering, and fractal branching emerge spontaneously from erosion-deposition without any external template. Canonical self-organized complex system; no blueprint imposed on basin structure."}
    emergence: {score: 3, confidence: high, note: "Drainage-basin power laws (area-slope scaling, discharge-width relationships) require macro-description via network-statistic and fluvial-geomorphology vocabulary. Practitioners use emergent order parameters (runoff coefficient, Hack exponent) predictively."}
    memory_hysteresis: {score: 3, confidence: medium, note: "Terrace sequences record flood history and prior-incision events (path-dependent). Nile annual-flow Hurst exponent ~0.71 (Hurst 1951) documents long-range memory in discharge. Path-dependence established via both geomorphic records and time-series analysis; no measured hysteresis loop so capped at 3 (per anchor scale: documented multistability needed for 4)."}
    information_processing: {score: 1, confidence: high, note: "Floodwaves propagate energy/mass through the channel network; this is pure physical transport, not detection. Threshold response to discharge exceeding bank-full (bifurcation, not signal channel). Calibrated to San Andreas anchor (physical stress-transfer, score 1)."}
    adaptive_capacity: {score: 1, confidence: high, note: "Channel geometry accommodates sustained forcing (width/depth adjust to equilibrium discharge), but no component changes its response function through learning. Structural accommodation only; capped at 1 per anchor definition."}
    criticality: {score: 0, confidence: medium, note: "No systematic power-law statistics of flood-size distributions in established literature. Floods cluster around characteristic scales tied to precipitation regime; no CSN-grade statistical fit or SOC mechanism claim. Differs from earthquake scaling."}
    tipping_transitions: {score: 1, confidence: medium, note: "Old River Control Structure represents engineered avulsion prevention; natural bifurcations (channel avulsion tipping points) exist but no formal systematic inventory analogous to climate tipping-elements literature. Informal language, no dedicated formal study."}
    chaos_sensitivity: {score: 1, confidence: high, note: "Streamflow variability is primarily stochastic-driven (precipitation) rather than chaotic. Deterministic chaotic dynamics not established for basin-scale flow. Some local turbulent regions, but not characteristic of basin system-dynamics."}
    openness_dissipation: {score: 3, confidence: high, note: "Continuous water/sediment mass flux maintains channel geometry (erosion balanced by deposition); interruption (damming) degrades channels within years. Flux is central to maintaining structure, though not as extreme as hurricanes (score 3 vs 4). Calibrated against feedback scale's dissipative-structure definition."}
    robustness_resilience: {score: 2, confidence: high, note: "Withstands common-spectrum perturbations (routine seasonal floods); known event classes (100-year floods, avulsions) can permanently alter channels. No recovery hysteresis-recovery for altered course. Normalized against basin timescale; major events cause degradation."}
    cascade_susceptibility: {score: 0, confidence: high, note: "No documented cascade mechanism in geomorphology literature. Channel failures do not propagate; sediment transport is load-driven, not failure-driven. Basin acts as a collecting network, not a failure-propagation system."}

  cities:
    decentralization: {score: 2, confidence: high, note: "NYC municipal government has strong authority over zoning, infrastructure, and regulation (steering authority exists). Yet agent behavior (migration, business location, consumption) is decentralized. Mixed: identifiable coordination points with real authority + equally weighty distributed dynamics. Calibrated against financial-markets anchor (central institution sets rules; traders make distributed decisions; score 2)."}
    modularity: {score: 2, confidence: medium, note: "Neighborhoods, boroughs (Manhattan, Brooklyn, Queens, Bronx) form recognizable units with higher within-neighborhood interaction density than cross-neighborhood. Cross-neighborhood flow (commuting, commerce) is substantial; boundaries shift. Q values not published, but qualitatively moderate modularity. Calibrated against Mississippi anchor's tributary modularity."}
    hierarchy_depth: {score: 3, confidence: medium, note: "City-level -> borough -> neighborhood -> block/building -> floor -> room creates ~6 nested levels. City planning operates at multiple scales. Less extreme than fault systems (Strahler 8-10) but substantial hierarchical nesting."}
    feedback: {score: 3, confidence: medium, note: "Dominant loops: (1) Congestion feedback [REINFORCING]: congestion -> commuting delay -> some out-migration -> reduced congestion. (2) Real-estate price feedback [REINFORCING]: demand -> rising prices -> new construction -> supply increase -> price moderation. (3) Service-availability feedback: population density -> demand for services -> service expansion -> attracts more residents. Multiple loops, not totalizing organizing principle (not 4). Outside crisis, many city dynamics (new business entry, neighborhood formation) are not obviously loop-dominated."}
    nonlinearity: {score: 3, confidence: medium, note: "Zipf rank-size law (rank-size ~1/rank^alpha, nonlinear), power-law income distributions, threshold effects in congestion (sudden breakdown). Nonlinearity is central to urban patterns but not pervasive at every organizational level. Some zones scale linearly (property values in stable neighborhoods). Calibrated against financial-markets anchor (herding is nonlinear, but not every price move is loop-dominated; score 3)."}
    self_organization: {score: 2, confidence: medium, note: "Zoning codes and infrastructure are designed by planners (strong external template). Emergent phenomena (traffic patterns, price fields, neighborhood character) spontaneously organize within this skeleton. Designed skeleton + substantial spontaneous order; matches anchor definition exactly."}
    emergence: {score: 3, confidence: high, note: "Urban-science macro-theories (allometric scaling, rank-size laws, scaling exponents for infrastructure) are used predictively and explain city-level phenomena not derivable by inspection from individual decisions. Wage curves, density gradients, rent surfaces are formalized macro-descriptions. Practitioners use these theories (Bettencourt, West)."}
    memory_hysteresis: {score: 2, confidence: medium, note: "Infrastructure lock-in (subway routes, building locations, grid patterns) constrains current development (e.g., NYC's frozen street grid from 1811). Post-disaster rebuilding shows path-dependence (e.g., New Orleans post-Katrina). No quantified hysteresis-loop measurement (e.g., population density rebound curve); documented path-dependence without loop capped at 2."}
    information_processing: {score: 3, confidence: medium, note: "Real-estate prices, wages, and rents are information aggregates. Traffic-signal systems detect congestion and respond conditionally. Gentrification signals social/economic opportunity and attracts investment (state-dependent response). Multiple channels (prices, signals, networks). Not full aggregation like markets (score 3, not 4). Calibrated against ERCOT anchor (multiple channels, state-dependent; held at 3 for reflexive components)."}
    adaptive_capacity: {score: 3, confidence: medium, note: "Zoning changes post-crisis (Manhattan rezoning post-9/11), infrastructure investment, demographic adaptation to economic shifts. Adaptation is real but slow, institutional, and episodic rather than pervasive and anticipatory. Many adaptive decisions by planners/developers. Slower than markets but more than fault systems."}
    criticality: {score: 0, confidence: medium, note: "No systematic power-law study of urban event sizes (fires, accidents, infrastructure failures) published as a rigorous fit. Urban complexity is widely claimed but without CSN-grade statistical fitting. Power-law-size claims for cities exist in literature but not established at the city level with rigor."}
    tipping_transitions: {score: 1, confidence: medium, note: "Urban decline/regeneration narratives (e.g., 'Detroit tipping point,' 'gentrification tipping point') are common in popular/policy language. No formal systematic inventory of urban tipping elements with named mechanisms and threshold estimates analogous to climate literature."}
    chaos_sensitivity: {score: 1, confidence: medium, note: "Traffic flow exhibits chaotic-like features locally, but city-scale dynamics are primarily stochastic (agent decisions, external demand) rather than deterministic chaos. No quantified Lyapunov exponent for urban systems; unpredictability mainly due to human agency and noise, not sensitive dependence."}
    openness_dissipation: {score: 3, confidence: high, note: "NYC consumes ~55 TWh/year electricity, plus natural gas, food, water. Continuous large-scale energy/material throughput required to maintain urban structure (buildings, systems, services). Interruption (major energy outage) causes rapid degradation. Throughput is centrally important (infrastructure support) but not the structure-generating mechanism like stellar fusion. Score 3, not 4."}
    robustness_resilience: {score: 2, confidence: medium, note: "NYC tolerates recessions, major weather (hurricanes, nor'easters), infrastructure incidents within design margins. Known perturbations (pandemic lockdowns, 9/11, Sandy) have caused significant disruption and degradation. Designed redundancy limits failures but major events exceed perturbation tolerance. Normalized for city-scale timescale (decades)."}
    cascade_susceptibility: {score: 1, confidence: medium, note: "Cascading infrastructure failures (blackout -> subway halt -> street chaos -> emergency response collapse) are documented informally and in case-study analyses (NYC 2003, 2012 Sandy). No formal fitted cascade-size distribution across many events. Plausibility established; empirical characterization thin (score 1, not 2)."}

  the-internet:
    decentralization: {score: 4, confidence: high, note: "BGP peering among ASes is fully distributed; no central controller steers moment-to-moment routing. IANA/ICANN set policies (standards bodies), not real-time control. System-wide behavior emerges entirely from local AS peering decisions. Matches scale-4 definition exactly."}
    modularity: {score: 3, confidence: high, note: "AS clustering (Tier-1 carriers, regional ISPs, CDNs, enterprise nets) creates clear modular structure. Measured Q values on AS graphs ~0.4-0.6 (strong modularity). Within-module peering density >> between-module; cross-module links exist but limited. Calibrated against ERCOT anchor (Q 0.6-0.9 range, score 3)."}
    hierarchy_depth: {score: 2, confidence: medium, note: "Tier-1/Tier-2/Tier-3 carrier hierarchy + enterprise networks create ~3-4 levels. Less extreme nesting than other systems; horizontal peering partially replaces strict hierarchy. Calibrated against feedback scale's hierarchy examples."}
    feedback: {score: 2, confidence: high, note: "Congestion feedback: high load -> BGP re-routes -> traffic shifts -> congestion eases. Update-rate feedback: route failures trigger BGP updates -> oscillations. Loops exist but are NOT the defining organizing principle of macro-level topology (AS graph structure is consequence of business relationships, not feedback loops). Scored 2: material in specific episodes (congestion events) but not continuously central."}
    nonlinearity: {score: 2, confidence: medium, note: "TCP congestion control has multiplicative interactions (packet-loss triggers exponential backoff). Packet-drop cascades exhibit nonlinear threshold behavior. Significant but not defining the Internet's macro-scale structure (AS topology is mainly designed, not nonlinearly emergent). Calibrated against feedback scale's nonlinearity range."}
    self_organization: {score: 3, confidence: high, note: "Internet backbone topology was designed; BGP and routing protocols are engineered standards. Yet macro-structure (traffic patterns, AS clustering) self-organizes through competitive peering, congestion response. Designed substrate + spontaneous overlay of traffic/routing patterns. Matches anchor definition."}
    emergence: {score: 3, confidence: high, note: "Routing-layer macro-theories (path-vector protocols, traffic-engineering order parameters like link utilization, flow aggregation) describe phenomena not obvious from individual AS rules. Network-layer concepts (congestion, bottleneck, AS path cost) are emergent order parameters used predictively in network operations."}
    memory_hysteresis: {score: 2, confidence: medium, note: "BGP convergence times (route persistence after link failure) show path-dependence. Routing-protocol state caches create memory. Network resets show history-dependence. No quantified hysteresis-loop measurement (e.g., traffic volume recovery curves after outage); path-dependence established without hysteresis width. Capped at 2 per San Andreas anchor logic."}
    information_processing: {score: 4, confidence: high, note: "BGP UPDATE messages, routing tables, SNMP telemetry form explicit signaling layer decoupled from data-plane traffic. Routers detect link failures and respond conditionally (route around failed links); behavior depends on receiver state (routing table, policy, congestion regime). State-dependent response aggregates routing information into forwarding decisions. Full multi-channel aggregation exemplifying scale 4. Identical to NYSE anchor reasoning."}
    adaptive_capacity: {score: 2, confidence: medium, note: "BGP automatically re-routes around failed links (reactive adaptation). Network operators reprogram policies post-incident (OSPF weights, BGP communities). Adaptation is rule-mediated and episodic (network patches, configuration updates). Not pervasive, anticipatory, or learning-driven. Capped at 2 per ERCOT anchor."}
    criticality: {score: 1, confidence: high, note: "AS-degree distribution follows power law (scale-free topology established). But this is TOPOLOGY criticality, not EVENT/dynamics criticality. No consensus on SOC mechanism driving topology formation. Packet-loss cascades studied but no fitted power-law size distribution like blackout datasets. Topology scale-free, but mechanism unclear; scored 1 per anchor guidance distinguishing topology from dynamics."}
    tipping_transitions: {score: 0, confidence: high, note: "No systematic inventory of Internet tipping elements analogous to climate literature. Routing instabilities, congestion collapses informally discussed but no formal bifurcation/regime-shift catalog with threshold estimates. No evidence of alternative stable states for the whole-Internet system."}
    chaos_sensitivity: {score: 1, confidence: high, note: "Packet traffic shows nonlinear dependence (self-similarity, long-range correlation in flows); no evidence of low-dimensional deterministic chaos. Traffic is complex and hard to predict, but unpredictability is driven by stochastic load and routing changes, not sensitive dependence on initial conditions. Per filling_rules.no-market-chaos logic: nonlinear dependence != chaos."}
    openness_dissipation: {score: 4, confidence: high, note: "Internet data centers and backbone routers consume massive continuous electricity (estimated order 100 GW global, ~500 TWh/year). Extreme physical throughput; interruption causes immediate system collapse. Energy throughput is the structure-maintaining mechanism (computation, routing processing). Matches hurricane anchor's score-4 criteria: extreme continuous flux, direct structure generation."}
    robustness_resilience: {score: 3, confidence: high, note: "Designed redundancy at AS/link level allows tolerance of node/link failures (N-2 planning in some carriers). Common perturbations absorbed via rerouting. Known attack classes (DDoS, BGP hijacking) can degrade service. Resilient to routine spectrum; major coordinated attacks or cascade events cause measurable degradation. Calibrated against ERCOT anchor (design margins absorbed, but major events cause failures)."}
    cascade_susceptibility: {score: 2, confidence: medium, note: "BGP instability cascades and routing loops documented in research literature and real incidents (e.g., YouTube/Pakistan BGP hijack 2008, AS7007 cascade 1997). Multiple case studies establish that cascades occur and spread beyond immediate origin. No fitted size-distribution across hundreds of events (score 2, not 3). Calibrated against financial-markets anchor (case-study evidence, not statistical distribution)."}

  languages:
    decentralization: {score: 4, confidence: high, note: "No central authority controls language evolution or change. All speakers contribute equally to usage patterns. No privileged locus of control. System-wide behavior (semantic drift, phonological shifts) emerges entirely from collective speaker interactions. Matches scale-4 definition exactly."}
    modularity: {score: 2, confidence: medium, note: "Dialects (US English, British English, Australian English) form quasi-modules with within-dialect lexical/phonological similarity. Registers (formal, colloquial, technical) are functionally separable. Cross-dialectal mixing and code-switching occur regularly. Boundaries are fuzzy. Qualitatively moderate modularity, no Q values computed."}
    hierarchy_depth: {score: 3, confidence: high, note: "Phoneme -> morpheme -> word -> phrase -> clause -> discourse creates ~6 nested organizational levels. Linguistic hierarchy is well established in structural linguistics; compositional structure is central to language. Multiple functional nesting levels."}
    feedback: {score: 2, confidence: medium, note: "Frequency-dependent learning: frequent words reinforced in speech/memory; rare words decay. Popular words/constructions spread (frequency-based selection). Loops exist but are NOT the totalizing explanation of language change (much change is random drift, external borrowing, or areal diffusion). Scored 2: material in specific domains (lexical frequency change) but not continuously central to the system's characteristic behavior."}
    nonlinearity: {score: 2, confidence: high, note: "Zipf rank-frequency law follows power-law (nonlinear) rather than linear; vowel shifts exhibit threshold/switch-like behavior (Great Vowel Shift). Heavy-tailed word-frequency distribution is nonlinear. But language production (word choice, sentence formation) is largely linear-combinatorial (compositional semantics). Nonlinearity concentrated in statistics, not production dynamics. Calibrated against nonlinearity anchor's 'concentrated not pervasive' criterion."}
    self_organization: {score: 4, confidence: high, note: "Lexical and phonological patterns emerge entirely from speaker usage without any external blueprint or design authority. No central language academy prescribes structural change (English has no official grammar). Grammar evolves from speaker interactions. Canonical example of self-organized system; zero external template for macro-structure."}
    emergence: {score: 3, confidence: high, note: "Zipfian statistics, entropy measures, syntactic complexity metrics (Kolmogorov complexity of parse trees) are formalized macro-level descriptions. Information-theoretic order parameters (entropy, coding length) describe language efficiently. Practitioners (computational linguists, language modelers) use emergent macro-concepts predictively. Not requiring full neural-simulation from scratch."}
    memory_hysteresis: {score: 3, confidence: medium, note: "Phonological fossils (irregular verbs 'went,' 'am,' lexical archaisms) record historical changes. Semantic etymologies trace past meanings (e.g., 'nice' meant 'foolish'). Loanwords show structural path-dependence (Romance vocabulary in Germanic English). Documented path-dependence in lexical/phonological structure. No quantified hysteresis loop (e.g., lexical recovery after contact-induced change) but historical structural record is itself primary evidence; scored 3 per anchor's structural-scarring criterion."}
    information_processing: {score: 4, confidence: high, note: "Language IS multi-layered information processing: speakers detect meaning from acoustic/visual input, integrate contextual cues, construct novel utterances from compositional rules. Aggregates phonemes into words, words into meanings. State-dependent: same phoneme string produces different meanings in different contexts (ambiguity resolution). Semantic composition produces novel meanings from parts. Matches NYSE anchor's aggregation-and-inference score-4 criteria exactly."}
    adaptive_capacity: {score: 3, confidence: high, note: "Individual speakers adjust register, vocabulary, and phonology based on social context and feedback (accommodation theory). Population adapts to demographic changes, contact with other languages (borrowing, code-mixing). Change is real, system-wide, and driven by speaker learning/selection. But not all speakers adapt equally; elderly speakers show less change. Adaptation is substantial but slower than market learning. Calibrated between ERCOT (2) and NYSE (4); language is institutional/cultural, score 3."}
    criticality: {score: 1, confidence: high, note: "Zipf rank-frequency distribution is power-law-like (exponent ~1.0-1.5 depending on corpus). But the power-law hypothesis is disputed by corpus linguists (some argue log-normal or exponential better fit). No CSN-grade statistical rigor applied to English word-frequency criticality claim. No SOC mechanism. Scored 1 per anchor: heavy-tailed observed, but mechanism and fit are contested."}
    tipping_transitions: {score: 1, confidence: medium, note: "Language shift (pidgin to creole) and language death are documented phenomena. No formal systematic inventory of 'language tipping elements' analogous to climate literature. Individual language-change scenarios (vowel shifts, merger events) studied, but no catalog of regime-shift bifurcations with threshold estimates."}
    chaos_sensitivity: {score: 0, confidence: high, note: "Language change is primarily stochastic (random drift, noise in learner/speaker population) or deterministic-gradient (replicator dynamics) but not sensitive dependence on initial conditions. No demonstrated low-dimensional chaos in language evolution. Unpredictability is due to human agency and randomness, not Lyapunov divergence."}
    openness_dissipation: {score: 0, confidence: high, note: "Language is an information system requiring no literal physical energy/material throughput. Speech involves air vibrations and neural firing (metabolic cost to speaker, out of scope per brief), but the SYSTEM's organization does not depend on continuous physical flux. Cognitive effort metaphor is not thermodynamic dissipation. Scored 0: not an open dissipative structure in the physical sense."}
    robustness_resilience: {score: 3, confidence: high, note: "Languages survive speaker population fluctuations (diaspora, migration), contact with other languages (code-mixing, borrowing), shift from oral to written medium. English expanded from ~5M speakers (1500) to 1.5B; survived Norman Conquest (absorbed French lexicon). Tolerates major perturbations. Known events (mass population movement, language-immersion policy) can cause language death or pidginization. Broad tolerance with some destructive thresholds."}
    cascade_susceptibility: {score: 0, confidence: high, note: "Language is not a network-topology system in the failure-propagation sense. Cascade mechanisms do not apply. Language change spreads through speaker population via diffusion, not failure cascades. No network-based cascade literature exists for languages."}
