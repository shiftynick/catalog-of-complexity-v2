rater: 2
model: sonnet
entries:

  stars:
    self_organization: {score: 4, confidence: high, note: "Granulation, supergranulation, and the magnetic network assemble spontaneously from convective/dynamo interactions with no external template of any kind; even stronger a case than the tropical-cyclones anchor (score 4) since there is no boundary forcing analogous to land/coastline shaping form. Web-checked: supergranulation network formation from granule aggregation is an open self-organization research question, confirming the spontaneous-genesis framing."}
    modularity: {score: 1, confidence: low, note: "Granulation/supergranulation cells tile the photosphere with fuzzy, constantly-reforming boundaries (granule lifetime ~0.2hr, supergranule ~1.8 day) rather than stable partitions; per does_not_count, spatial patchiness alone (contour-lines on a gradient) doesn't count unless it reflects reduced functional coupling, and the convective network is closer to a continuum with locally denser flow cells than a network with a preferred Q-maximizing partition. Scored just above 0 because there is at least a real physical scale-separation (granules vs supergranules vs giant cells) that supports some grouping, unlike a fully uniform field."}
    nonlinearity: {score: 4, confidence: high, note: "Calibrated directly against the tropical-cyclones anchor (score 4): stellar convection and the dynamo are governed by the nonlinear MHD/Navier-Stokes equations with multiplicative coupling (velocity-field advection, magnetic induction back-reacting on flow via Lorentz force); nonlinearity is pervasive and load-bearing for granulation, the 11-year cycle, and flare/CME triggering simultaneously."}
    criticality: {score: 1, confidence: medium, note: "Solar flare size distributions are widely reported as power-law/heavy-tailed (informally 'looks straight' on log-log) and SOC (self-organized criticality) has been proposed as a mechanism for flares since Lu & Hamilton (1991), but I could not confirm a CSN-2009-grade statistical fit for this system; per the scale this sits at 1 (heavy-tailed claimed informally, mechanism speculative/contested) rather than 2, calibrated against the financial-markets anchor (1) where fat tails are solid but criticality-as-mechanism is weak."}
    memory_hysteresis: {score: 1, confidence: low, note: "The 11-year magnetic cycle shows some cycle-to-cycle memory (web search: turbulent flux pumping reduces dynamo memory to about one cycle), which is short-lived relaxation-type persistence rather than documented bistability/hysteresis-loop with two stable states at the same forcing; calibrated below the earthquake-fault anchor (2, genuine path-dependence but no published loop) since solar cycle memory is weaker and shorter (about one cycle only) than fault stress-shadow persistence across decades."}
    feedback: {score: 3, confidence: medium, note: "The dynamo is fundamentally a feedback phenomenon (differential rotation + convection generate field, field back-reacts on flow via Lorentz-force quenching, a documented reinforcing/balancing pair), and WISHE-like local reinforcing loops are absent, so this doesn't reach the tropical-cyclone/climate anchor level of a single all-explaining loop system; scored 3 (multiple loops continuously active, required to explain cyclic behavior) rather than 4 because, unlike Katrina's WISHE, no single loop is THE definitional mechanism of the star's day-to-day existence (hydrostatic equilibrium is not itself a dynamical feedback loop in the causal-cycle sense)."}
    tipping_transitions: {score: 1, confidence: low, note: "No systematic inventory of solar tipping elements analogous to Lenton/McKay's climate framework was found; 'grand minima' (Maunder Minimum-type dynamo shutdowns) are informally discussed as regime shifts but I could not confirm a formal bifurcation/threshold model published with the rigor of the climate anchor. Calibrated at the earthquake-fault anchor level (1): informal regime-shift language exists, no formal inventory."}
    information_processing: {score: 0, confidence: high, note: "Directly calibrated against this column's explicit design intent: radiation and convective heat/momentum transport through the stellar interior and photosphere is pure physical energy transport with no detection-comparison-response step, matching the canonical 0 examples (waves through a medium, heat conduction) named in the scale itself. Even magnetic reconnection/flare triggering is a physical threshold (comparable to the fault-friction anchor at 1) rather than a 0 case, but that's a rare localized phenomenon, not the star's dominant dynamics, so class-general score stays at 0."}
    openness_dissipation: {score: 4, confidence: high, note: "Directly calibrated against, and arguably exceeding, the tropical-cyclones anchor (4): the Sun's luminosity is ~3.8x10^26 W, continuously generated by core fusion and continuously radiated to space; interrupting the flux would (on the photon-diffusion timescale for surface layers, much shorter than the star's structural lifetime) collapse the observed radiative structure. This is the textbook extreme-throughput dissipative case the scale's 4-band is written around."}
    chaos_sensitivity: {score: 3, confidence: medium, note: "Web-confirmed: solar convection displays chaotic, turbulent character, and dedicated 'pseudo-Lyapunov exponent' studies of solar convection exist (Kutsenko et al., Entropy 2021) alongside evidence that turbulent flux pumping limits dynamo predictability to about one cycle. This is genuine, broadly-accepted chaotic behavior in reduced/model descriptions without a single, universally validated real-system Lyapunov figure with the operational status of the atmospheric ~2-week horizon, so calibrated at the planetary-climate anchor level (3) rather than the tropical-cyclone anchor (4)."}
    emergence: {score: 3, confidence: high, note: "Calibrated directly against the Rayleigh-Benard anchor (score 3, same underlying convective-pattern-formation physics): granulation/supergranulation are described via genuine order-parameter/pattern-formation language (convective cell size, Rayleigh-number-indexed regimes) that does real predictive/explanatory work and is not transparent from raw MHD equations by inspection. Held at 3 rather than 4 because (unlike price formation) a single family of convection order-parameters, not multiple field-defining macro-theories, does most of the explanatory work for the star's characteristic surface phenomena."}
    adaptive_capacity: {score: 0, confidence: high, note: "Directly calibrated against the planetary-climate anchor (0): the Sun is rich in feedback (dynamo, convective driving) but no component changes its response function through experience — plasma physics is fixed; there is no learning, selection, or anticipatory adjustment at any level."}
    decentralization: {score: 4, confidence: medium, note: "No privileged controller exists at any scale; granulation, the dynamo, and flare triggering all arise from local plasma/field interactions with zero central steering component, matching the scale's top anchor description more cleanly than any engineered-system anchor in the packet (which all retain some coordination point)."}
    robustness_resilience: {score: 3, confidence: medium, note: "At exemplar(the-sun) level: the Sun has maintained stable main-sequence structure and output across billions of years despite convective turbulence, flares, and cycle variability — broad tolerance of its characteristic perturbation spectrum with recovery (e.g., post-flare relaxation), calibrated above the Katrina anchor (1, narrow envelope, routinely destroyed) since the star's own perturbation spectrum (turbulent convection, magnetic activity) does not threaten its structural identity the way routine environmental exposure threatens a hurricane's. Not 4, since major dynamo disruptions (grand minima) do represent a real, if partial, functional excursion."}
    cascade_susceptibility: {score: 0, confidence: low, note: "No documented mechanism by which a local convective or magnetic failure propagates to destabilize the star as a whole was found; flares/CMEs are localized reconnection events that release energy without a documented network-cascade-style propagation through a coupled system of discrete components, unlike the power-grid anchor's blackout-propagation literature. This column presumes a networked/coupled-component failure-propagation claim that doesn't map well onto a continuum plasma body, so scored at the floor."}

  river-networks:
    self_organization: {score: 4, confidence: high, note: "Calibrated directly against the tropical-cyclones anchor (4): the dendritic channel network and Horton/Strahler statistics emerge spontaneously from local erosion-deposition feedback between flow and bed/bank geometry, with no template specifying the branching form in advance — a canonical self-organized geomorphic structure, reinforced by the brief's own framing of the network as 'a self-organized transport structure.'"}
    modularity: {score: 1, confidence: medium, note: "A dendritic tree has strong hierarchical nesting (captured by hierarchy_depth) but per does_not_count, hierarchy is not modularity: a tree topology has no lateral subdivision into parallel, loosely-coupled peer subunits — every link is in series with its downstream neighbor, and water/sediment flow couples all links continuously along the flow path. Scored 1 rather than 0 because sub-basins (tributary catchments) are at least weakly distinguishable as quasi-autonomous drainage units before they confluence."}
    nonlinearity: {score: 3, confidence: medium, note: "Erosion/sediment-transport laws are intrinsically nonlinear (sediment flux scales as a high power of flow velocity/shear stress, channel-forming discharge thresholds, meander-migration instabilities), and this nonlinearity is required to reproduce the observed self-similar branching geometry — calibrated similarly to the earthquake-fault anchor (3): central to characteristic behavior (channel formation, avulsion) but the system spends much time in comparatively gradual, quasi-linear sediment transport between threshold-crossing events (bank failure, avulsion)."}
    criticality: {score: 1, confidence: low, note: "River network branching statistics (Horton ratios, drainage-area power laws) are described in the literature as power-law/self-similar (web-confirmed: 'power-law relationships between morphologic components'), but this is a static topological scaling claim rather than a scale-invariant EVENT-statistics/SOC claim as required by this column's does_not_count clause; I found no CSN-grade fit of a dynamical event distribution (e.g., avulsion sizes) for river networks. Scored 1: informal power-law-shaped claims exist in the literature, no rigorous event-statistics fit or established SOC mechanism located."}
    memory_hysteresis: {score: 3, confidence: medium, note: "The brief itself flags the Old River Control Structure as making an engineered near-avulsion concretely citable — the Mississippi's present channel geometry is strongly path-dependent on centuries of meander/avulsion history, and delta lobe-switching is a documented discrete regime-shift-like structural record. Calibrated at the financial-markets anchor level (3, documented path-dependent regime effects, not a single canonical quantitative loop) since I could not confirm a quantified hysteresis-loop-width figure specific to channel avulsion equivalent to the AMOC 0.4 Sv figure."}
    feedback: {score: 3, confidence: medium, note: "Flow-sediment-geometry feedback is the field's central organizing mechanism: higher flow -> more erosion/sediment transport -> channel widens/steepens -> altered flow -> loops back (reinforcing in avulsion, balancing in normal channel-maintenance equilibrium). Calibrated at the financial-markets anchor level (3, multiple loops continuously active and required to explain characteristic dynamics) rather than 4, since unlike WISHE for hurricanes, no single loop is quite as totalizing an explanation of all river-network phenomena (headward erosion, meandering, and avulsion each have somewhat distinct loop structures)."}
    tipping_transitions: {score: 2, confidence: medium, note: "The Mississippi/Atchafalaya avulsion threat (formalized enough that the Army Corps built the Old River Control Structure specifically to prevent a modeled capture event) is a single, well-identified regime-shift case with a named mechanism and real engineering response, but this is a single case rather than a systematic multi-element inventory analogous to the climate anchor (4) or even the financial-markets anchor's individual-case-with-modeled-threshold level (2). Calibrated at the financial-markets anchor level (2)."}
    information_processing: {score: 0, confidence: high, note: "Water and sediment flux through the channel network is physical transport (mass/momentum flow) with no detection-comparison-response step; even threshold-crossing erosion (bank failure at a critical shear stress) is a bifurcation in the dynamics, not detection, per the scale's own guidance on fixed physical thresholds. Directly calibrated against the fault-system anchor (1) but scored a notch below it: I did not find even a discrete threshold-comparison analogous to rate-and-state friction that the literature treats as a 'detection' step — erosion thresholds are continuously graded shear-stress functions, not a documented discrete comparison mechanism, so 0 is the better fit than 1."}
    openness_dissipation: {score: 3, confidence: medium, note: "A river network requires continuous, substantial water and sediment throughput (driven by precipitation/gravity) to maintain its channel geometry; interrupting flow (as in a diverted or dammed reach) causes documented channel degradation (aggradation, vegetation encroachment) within a timescale comparable to the channel's own adjustment timescale. Calibrated below the hurricane anchor (4, extreme throughput with near-immediate collapse on flux interruption) since channel geometry decays more slowly than a hurricane's wind field does, but clearly above the fault anchor (1, slow tectonic battery) since river discharge is a continuously renewed, substantial, structure-generating flux — matches the scale's level-3 description of a genuine Prigogine-type dissipative structure."}
    chaos_sensitivity: {score: 1, confidence: low, note: "I found no dedicated literature establishing sensitive dependence on initial conditions for channel network geometry or discharge dynamics specifically (as opposed to weather/precipitation forcing, which is chaotic but external forcing per this column's own exclusion of exogenous-forcing-dominated evolution). Scored 1: not the dominant characteristic dynamic, and I could not locate even contested model-level chaos claims specific to fluvial geomorphology."}
    emergence: {score: 2, confidence: medium, note: "Horton's laws and Strahler ordering constitute genuine pattern-specific vocabulary used descriptively by the field, and the fractal dimension (D ~ 1.9, web-confirmed) is a quantitative macro-descriptor, but I judged this closer to the scale's level-2 description (recognizable pattern with domain vocabulary, not yet a fully independent predictive macro-law/order-parameter with the field-defining status of Rayleigh number or price) than level 3; Horton ratios are largely descriptive regularities derived in a fairly direct statistical-self-similarity sense (per the search result reformulating Horton's law as statistical self-similarity) rather than an independently predictive effective theory."}
    adaptive_capacity: {score: 1, confidence: high, note: "Directly calibrated against the does_not_count clause's own worked example: 'structural accommodation (erosion reshaping a channel) counts at most 1' — channel widening/avulsion IS exactly this phenomenon: configuration adjusts to sustained forcing, but no component changes a rule of behavior (per the brief's scoping, human engineering like the Old River Control Structure is explicitly a boundary intervention, not an internal adaptive component)."}
    decentralization: {score: 4, confidence: high, note: "No privileged controller exists within the natural system boundary as scoped (human engineering works are explicitly excluded as boundary interventions per the brief); channel network behavior arises entirely from local flow-sediment-geometry interactions at every confluence and reach, matching the scale's top-level description directly."}
    robustness_resilience: {score: 3, confidence: medium, note: "Class-level: river networks as a structural type persist and functionally recover (channel re-equilibration after floods, sediment pulses) across a broad range of common perturbations (seasonal flood variability, moderate sediment pulses), often with lasting scars (avulsion, terrace formation) — matching the scale's level-3 'absorbs common perturbations and some large shocks, recovering function, possibly with hysteresis.' Not 4, since major perturbations (catastrophic avulsion, damming) can permanently alter network identity rather than being absorbed."}
    cascade_susceptibility: {score: 1, confidence: low, note: "Local channel failures (bank collapse, avulsion at one node) can propagate downstream effects (altered sediment supply, channel adjustment in downstream reaches) — a plausible domino-style mechanism informally discussed in fluvial geomorphology — but I did not locate a dedicated empirical or model-based study specifically characterizing cascade size/extent for river-network failure propagation, so this sits at the scale's level-1 (plausible/informally discussed, no dedicated study) rather than level 2."}

  cities:
    self_organization: {score: 2, confidence: medium, note: "Calibrated against the ERCOT anchor (1) but scored higher: cities have a substantial designed skeleton (streets, zoning, utility grids are planned/legislated) yet the brief's own scoping note treats land use, commuting patterns, and economic agglomeration as arising from resident/market interactions on top of that skeleton — matching the scale's level-2 description ('designed skeleton with substantial spontaneous order living on top of it') more closely than ERCOT's mostly-designed level-1 case, since urban superlinear scaling patterns (web-confirmed Bettencourt/West/Lobo scaling laws) were not designed into the street grid."}
    modularity: {score: 3, confidence: medium, note: "Neighborhoods are the field's own worked anchor example for strong modularity in the modularity.yaml notes ('neighborhoods of a city' cited alongside 'organs of a corporation, cells of a power grid' as unambiguous domain-consensus module examples at the Q~0.4-0.6 strong-modularity band); scored 3 directly on that basis, with substantial cross-neighborhood commuting/economic flow preventing a 4."}
    nonlinearity: {score: 3, confidence: medium, note: "Bettencourt-type urban scaling laws are explicitly nonlinear power-law relationships (superlinear ~1.15 for socioeconomic output, sublinear ~0.83 for infrastructure, web-confirmed) that are central to how the field describes city behavior, and agglomeration/congestion dynamics involve threshold and multiplicative effects (traffic congestion nonlinearity, network effects in innovation). Calibrated at the financial-markets anchor level (4 there) but scored one lower (3) since, unlike markets, city-level nonlinearity is somewhat more concentrated in specific subsystems (scaling relations, transport) than pervasive across essentially all subsystems simultaneously."}
    criticality: {score: 1, confidence: low, note: "I found no CSN-grade power-law event-statistics fit or established SOC mechanism specific to city-level events (e.g., traffic jams, blackout-style urban infrastructure failures might qualify but weren't confirmed for cities specifically); urban scaling laws themselves are a STRUCTURAL/topological power law, not an event-statistics claim, and per criticality.yaml's own guidance this doesn't count. Scored 1: heavy-tailed claims plausible/informally discussed (city size distributions, discussed under numerosity/Zipf's law for cities elsewhere in the panel, not this column) but no rigorous EVENT-statistics fit located here."}
    memory_hysteresis: {score: 3, confidence: medium, note: "Cities show strong, well-documented path dependence in built structure (infrastructure, neighborhood composition, and land-use patterns strongly outlive the conditions that created them — e.g., historical redlining's persistent effects on neighborhood economic composition, or post-industrial cities retaining industrial-era infrastructure and land-use patterns decades after deindustrialization), calibrated at the financial-markets anchor level (3, documented path-dependent regime effects, not a single canonical quantitative loop) since no single quantified hysteresis-loop-width figure analogous to AMOC exists for urban structure."}
    feedback: {score: 3, confidence: medium, note: "Agglomeration economics is fundamentally loop-structured (more residents/firms -> denser markets/labor pools -> more productivity/attractiveness -> more in-migration, a documented reinforcing loop in urban economics) with balancing loops (congestion, rent, cost-of-living rise that cap growth). Calibrated at the financial-markets anchor level (3): multiple loops continuously active and required to explain characteristic growth/congestion dynamics, but not the sole totalizing explanatory device for all city phenomena the way WISHE is for hurricanes."}
    tipping_transitions: {score: 1, confidence: low, note: "Urban 'tipping point' language (neighborhood racial/economic tipping, per Schelling-style segregation dynamics) is well known informally and has some formal modeling tradition (Schelling 1971 segregation model), but I could not confirm this rises to a systematic, citable multi-element inventory analogous to the climate anchor; calibrated at the financial-markets anchor level (2) is tempting given Schelling's formal model, but I settled on 1 since Schelling tipping is a single classic model rather than a documented systematic inventory with threshold estimates across multiple named urban tipping elements — closer to 'informal + one plausible mechanism speculated' than 'formally identified and modeled with published threshold.'"}
    information_processing: {score: 3, confidence: medium, note: "Cities run substantial engineered/institutional information layers (traffic signal systems and increasingly adaptive traffic control, 311 service-request systems, real-time transit/utility monitoring, municipal budgeting/planning processes that integrate multiple inputs into state-dependent policy responses) — calibrated at the ERCOT anchor level (3): multiple integrated channels with genuinely conditional responses, but core infrastructure control retains a large hardwired/reflexive component (traffic lights on fixed timing, utility distribution largely non-adaptive) preventing a 4."}
    openness_dissipation: {score: 3, confidence: medium, note: "Cities require continuous, large-scale energy/material throughput (electricity, fuel, food, water) that is directly responsible for maintaining the city's characteristic function and structure — unlike the NYSE anchor (2, where energy is 'infrastructure support' not the generative mechanism), a city's throughput (energy for building climate control, transport, industry) IS substantially constitutive of its function, not merely supporting a separate information process, matching level 3's 'genuine dissipative structure ... flux directly responsible for generating and maintaining structure.' Not 4, since a city, unlike a hurricane, does not physically collapse rapidly upon flux interruption relative to its own timescale — it degrades over weeks/months, not hours."}
    chaos_sensitivity: {score: 1, confidence: low, note: "No dedicated Lyapunov-exponent or sensitive-dependence literature specific to urban systems as a whole was located; traffic flow dynamics are known to exhibit nonlinear instabilities (stop-and-go waves) but I could not confirm this rises to established chaos beyond localized sub-processes. Scored 1: weak/localized sensitive dependence plausible in specific sub-processes (traffic), not characteristic of city-level dominant dynamics."}
    emergence: {score: 3, confidence: medium, note: "Urban scaling laws (Bettencourt et al.) are a formalized, field-defining macro-law used predictively across many cities (web-confirmed superlinear ~1.15 / sublinear ~0.83 exponents) — this directly matches level 3's 'formalized order parameter or macro-level effective law ... used predictively/explanatorily by the relevant field.' Not scored 4 (reserved per the notes for cases like price formation where the ENTIRE explanatory apparatus of the field is macro-theory) since urban studies also relies heavily on micro-level planning/engineering description alongside scaling theory."}
    adaptive_capacity: {score: 3, confidence: medium, note: "Per the brief's explicit scoping (municipal government is an internal adaptive institution, zoning changes and post-crisis infrastructure hardening count as internal adaptation, mirroring the financial-markets treatment), residents/firms and city government possess internal models and adjust behavior anticipatorily (zoning reform, infrastructure hardening after disasters, business relocation decisions) — calibrated just below the financial-markets anchor (4, pervasive multi-level adaptation with strategy-revising algorithms) since municipal institutional adaptation is real but slower and more bureaucratically mediated than market adaptation, matching level 3's 'many components possess internal models ... adaptation is real but slow, partial, or weakly strategic.'"}
    decentralization: {score: 2, confidence: medium, note: "Calibrated directly against the financial-markets anchor (2): municipal government has real authority over zoning, infrastructure, and some economic regulation (a genuine coordination point), but the characteristic dynamics of interest — land use, commuting patterns, economic agglomeration, neighborhood formation — emerge from millions of distributed resident/firm decisions no single authority commands, an exact structural parallel to the NYSE case (exchange operates the mechanics; price formation is distributed)."}
    robustness_resilience: {score: 3, confidence: medium, note: "Class-level: cities as a system-type show broad tolerance, absorbing common shocks (economic downturns, moderate natural disasters, population shifts) and recovering function, often with lasting scars (post-industrial decline, gentrification following crisis) — matching level 3 ('broad tolerance ... recovering function, possibly with hysteresis or scars') directly, calibrated above the Katrina anchor (1, narrow envelope) and the ERCOT anchor (2, moderate) since cities have historically demonstrated recovery from war damage, deindustrialization, and pandemics at the class level even when individual instances suffer severely."}
    cascade_susceptibility: {score: 2, confidence: low, note: "Urban infrastructure interdependency (power-water-transport-communications cascading failures) is a recognized engineering risk area with documented case studies (e.g., interdependent-infrastructure cascade analyses cited in the network-robustness literature more broadly), calibrated at the financial-markets anchor level (2): dedicated studies/case analyses exist establishing that cascades occur and roughly characterizing extent, but I did not find a citywide fitted cascade-size distribution across many real events analogous to the Dobson power-grid blackout dataset."}

  the-internet:
    self_organization: {score: 2, confidence: high, note: "This is the notes-file's own worked contrast case: 'Internet: designed substrate with spontaneous macro-structure (2 here) but nearly no central control (3 there) — the two columns disagree, and that disagreement is real signal.' Directly citing the anchor file's explicit guidance for this exact system: individual protocols/routers are engineered, but AS-graph topology (power-law degree distribution, web-confirmed Faloutsos et al.) and traffic self-similarity were not designed in advance."}
    modularity: {score: 2, confidence: medium, note: "AS-level community detection studies exist (web-confirmed general applicability of modularity/Q-value analysis to AS-level Internet topology) and ASes cluster by geography/business relationship, but the Internet is the notes file's own explicit example of comparatively LOW modularity relative to power grids ('community-detection studies on power-grid topologies commonly report Q in the 0.6-0.9 range' with the implicit contrast that the Internet, per modularity.yaml's broader network-science literature, typically shows lower Q, roughly 0.2-0.4-ish, than physically-constrained infrastructure networks). Scored 2 (moderate, identifiable modularity, substantial cross-module flow, shifting boundaries) as the best fit given AS relationships are numerous, overlapping, and highly dynamic."}
    nonlinearity: {score: 3, confidence: medium, note: "TCP congestion control (AIMD - additive-increase/multiplicative-decrease) is an intrinsically nonlinear, threshold/switch-like algorithm, and BGP routing dynamics show documented nonlinear instabilities (route flapping, slow convergence pathologies); this nonlinearity is required to reproduce observed traffic/congestion phenomenology. Calibrated at the earthquake-fault anchor level (3: nonlinear interactions central to characteristic behavior) rather than 4, since much steady-state packet forwarding is close to linear queueing behavior between congestion episodes."}
    criticality: {score: 1, confidence: low, note: "Traffic self-similarity/long-range dependence (Leland et al.'s well-known Ethernet traffic self-similarity finding) is sometimes informally described in power-law terms, and AS-degree distribution is a well-established static power law — but per criticality.yaml's explicit exclusion, static scale-free network TOPOLOGY is out of scope for this column (belongs under degree_distribution) and must not inflate this score without scale-invariant EVENT dynamics. Scored 1: no CSN-grade event-statistics fit or established SOC mechanism for Internet-specific cascading/failure events was confirmed, only informal heavy-tail-shaped claims."}
    memory_hysteresis: {score: 3, confidence: medium, note: "The AS-graph topology carries strong structural path-dependence (preferential attachment means early-connected ASes retain hub status for decades; peering relationships and routing policy scars from historical events like major outages persist) — the brief's own note that BGP updates and topology are measured as a single-instance time series across decades (n=10,697 ASes in 2001 to ~75,000-83,739 in 2025) supports genuine structural memory. Calibrated at the financial-markets anchor level (3): documented path-dependent structural effects, no single canonical quantitative hysteresis-loop-width figure."}
    feedback: {score: 3, confidence: medium, note: "TCP congestion control is textbook feedback (packet loss/RTT signal -> window size adjustment -> traffic rate -> loops back to congestion state, both reinforcing during slow-start and balancing during congestion avoidance), and BGP route selection responds to advertised state in a loop (route withdrawal/announcement propagates and reshapes future routing decisions). Calibrated at the ERCOT/financial-markets anchor level (3): multiple loops continuously active and required to explain characteristic congestion/routing dynamics, not quite the singular totalizing mechanism level of WISHE."}
    tipping_transitions: {score: 1, confidence: low, note: "No systematic inventory of Internet-specific tipping elements/regime shifts was located; BGP route-flapping and large-scale routing instability events are discussed informally as cascading/destabilizing but I found no formal bifurcation-threshold literature analogous to the climate anchor. Scored 1: informal language plausible, no dedicated formal regime-shift study confirmed."}
    information_processing: {score: 4, confidence: medium, note: "Calibrated directly against, and matching or exceeding, the ERCOT anchor (3) per the information_processing.yaml notes' own explicit statement that 'Engineered systems (ERCOT, Internet — ... expected to land in the 3-4 range for the same SCADA/protocol reasons as ERCOT).' Scored 4: BGP, DNS, TCP congestion control, and CDN/traffic-engineering systems constitute rich, multi-channel, aggregative information processing (route aggregation from thousands of dispersed AS announcements into forwarding decisions; congestion control adapting to inferred network state) — genuinely combining dispersed partial information into a constructed state that conditions downstream behavior, matching level 4's description closely."}
    openness_dissipation: {score: 2, confidence: low, note: "The Internet's physical substrate (routers, datacenters, transmission equipment) draws continuous, substantial electrical power globally, but — directly parallel to the NYSE anchor's reasoning (scored 2) — this throughput is what keeps the computing/transport substrate running, not the literal generative mechanism of the system's characteristic informational dynamics (routing, congestion) the way a hurricane's heat flux literally generates its wind field. Scored 2 on the same logic as the NYSE anchor."}
    chaos_sensitivity: {score: 1, confidence: low, note: "TCP/AIMD congestion dynamics and BGP route oscillation show documented nonlinear, sometimes unpredictable behavior, but per the does_not_count guidance, 'hard to forecast' or high-dimensional variability alone does not establish chaos without demonstrated exponential divergence; I found no dedicated Lyapunov-exponent study for Internet traffic/routing dynamics. Scored 1: plausible localized nonlinear instability, not an established characteristic chaotic regime."}
    emergence: {score: 3, confidence: medium, note: "AS-level graph-theoretic macro-description (degree distribution, small-world/scale-free structure, web-confirmed Faloutsos power-law finding) and traffic self-similarity/long-range-dependence parameters are genuinely new, quantitatively formalized macro-descriptive machinery used predictively by network science and network engineering — not transparent from individual router configuration by inspection. Calibrated at the Rayleigh-Benard/hurricane anchor level (3) rather than 4, since network engineering also relies heavily on direct micro-level (per-router, per-link) configuration and monitoring alongside the macro-theory."}
    adaptive_capacity: {score: 2, confidence: medium, note: "TCP congestion-control algorithms adjust behavior via fixed-rule feedback (additive-increase/multiplicative-decrease responding to packet loss) without anticipation or internal models in most deployments, and ISPs/operators periodically retune routing policy and peering after incidents (an episodic, rule-mediated adaptation) — calibrated directly at the ERCOT anchor level (2): components change behavior via feedback/selection among fixed rules without anticipatory internal models, matching almost exactly (ERCOT's protection-scheme retuning after events parallels ISP routing-policy retuning after outages)."}
    decentralization: {score: 3, confidence: high, note: "Directly calibrated against the decentralization.yaml notes' own explicit guidance for 'a global communications network' as a worked boundary case: 'score the layer where the system's characteristic behavior lives (traffic/topology), not the bookkeeping layer' — IANA/ICANN/IETF are bookkeeping-only coordination (naming, standards), not real-time steering of routing/traffic, matching level 3's 'coordination points exist but are narrow in scope ... and do not steer moment-to-moment behavior' almost exactly."}
    robustness_resilience: {score: 3, confidence: medium, note: "Web-confirmed: the AS-level Internet is documented to be robust to random node/router removal (diameter barely changes even removing up to 2.5% of routers) due to its heterogeneous degree distribution — broad tolerance of common perturbations (routine link/router failures) with graceful degradation, matching level 3. Not scored 4 because the same literature documents fragility to targeted hub (high-degree AS) removal/attack, a known class of perturbation within its plausible threat spectrum that can cause disproportionate damage — precluding 'exceptional multi-scale robustness ... across nearly the full perturbation spectrum.'"}
    cascade_susceptibility: {score: 2, confidence: medium, note: "Web-confirmed: scale-free networks like the AS-graph are documented in dedicated studies to be susceptible to cascading overload failures, especially following high-degree node removal, and real large-scale routing incidents (e.g., major BGP leak/hijack events causing widespread outages) are documented case studies. Calibrated at the financial-markets anchor level (2): dedicated studies/case analyses establish cascades occur and characterize rough extent, but I did not confirm a fitted cross-event cascade-size power-law distribution across many real Internet outage events analogous to the Dobson blackout dataset."}

  languages:
