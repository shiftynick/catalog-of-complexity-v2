model: opus
entries:
  stars:
    decentralization: {score: 4, confidence: high, note: "No privileged controller; the star's structure and dynamics arise entirely from local physics (gravity, pressure, radiative transport, convection) with no steering component. Well below ERCOT's operator-steered 1 and NYSE's 2 — there is no controller at all."}
    self_organization: {score: 4, confidence: high, note: "All macroscopic order (convective granulation, magnetic activity cycle, hydrostatic stratification) assembles spontaneously from local plasma/field interactions with no designer or template — the tropical-cyclones anchor's authorless dissipative-structure case (score 4), not ERCOT's engineered 1."}
    modularity: {score: 1, confidence: medium, note: "A continuum plasma/field system; radial shells (core/radiative/convective zones) are gradational stratification, not laterally loosely-coupled peer modules. Granulation cells tile the surface but are not functionally insulated subsystems. Weak/gradational structure (scale-1), well below the power-grid balancing-area 3."}
    nonlinearity: {score: 4, confidence: high, note: "Governing dynamics (magnetohydrodynamics, nonlinear convection, dynamo action) are pervasively and load-bearingly nonlinear across multiple subsystems — convective turbulence, magnetic reconnection, flares as threshold events. Matches the tropical-cyclones/NYSE score-4 pattern of nonlinearity definitional at multiple scales."}
    criticality: {score: 1, confidence: medium, note: "Solar flare energy releases are widely claimed to show power-law (avalanche/SOC) statistics, and log-log plots 'look straight,' but this sits at the informal/contested end without CSN-grade fits held to consensus. Matches NYSE's score-1 (heavy-tailed observed, mechanism weak/contested), not the rice-pile positive control (3)."}
    memory_hysteresis: {score: 1, confidence: low, note: "State is largely set by current internal conditions; the magnetic-activity cycle carries some short-lived relaxation memory but no documented hysteresis loop or bistability at the main-sequence-star level. Sits at scale-1 relaxation memory, below the fault system's path-dependent 2."}
    feedback: {score: 3, confidence: medium, note: "Multiple continuously-active loops are required to explain the star: the stabilizing pressure-temperature-fusion thermostat (balancing, gives stable main-sequence burning) plus convective and dynamo loops. Removing them qualitatively changes behavior — scale-3. Held below the climate/hurricane 4 as the loop structure is less the field's sole organizing narrative."}
    tipping_transitions: {score: 1, confidence: medium, note: "For a MATURE main-sequence star (per scoping, later evolutionary stages excluded as context), no systematic tipping-element inventory or documented in-lifetime bifurcation applies; evolutionary regime changes are excluded from scope. Scale-1 (informal/no formal regime-shift inventory), like the fault system."}
    information_processing: {score: 0, confidence: high, note: "Purely forced physical propagation — radiative transport, convection, MHD — with no detection step, no channel carrying a signal decoupled from its energy, no state-dependent representational response. The central-exclusion 0 (radiation diffusing through plasma is explicitly named a canonical 0)."}
    openness_dissipation: {score: 4, confidence: high, note: "A star sits far from equilibrium with an enormous continuous energy throughput (fusion-powered luminosity, ~10^26 W for the Sun) radiated continuously to space; the flux maintains the whole structure. Matches the hurricane's score-4 far-from-equilibrium dissipative engine (though Phi_m is low, absolute flux is the structure-maintaining mechanism)."}
    chaos_sensitivity: {score: 2, confidence: low, note: "Surface convection/granulation and magnetic activity are turbulent and hard to forecast, and some solar-cycle prediction work implies sensitive dependence, but no validated real-star Lyapunov exponent/predictability horizon exists and the character is mixed. Scale-2 (genuine but mixed/contested), like the fault system, not the atmosphere's measured 4."}
    emergence: {score: 3, confidence: medium, note: "Convection is described with genuine order-parameter machinery (Rayleigh number, convective-regime bifurcation) exactly as in the Rayleigh-Benard anchor (score 3); granulation and dynamo patterns need macro-descriptive vocabulary not read off micro-rules. Solid weak emergence at 3, not the multi-theory NYSE 4."}
    adaptive_capacity: {score: 0, confidence: high, note: "Component behavior is fixed by physics; feedbacks operate but no component revises its response function through experience. The planetary-climate score-0 case exactly — rich in feedback/memory but zero adaptation, the CAS discriminator."}
    robustness_resilience: {score: 4, confidence: medium, note: "Over its multi-billion-year main-sequence lifetime the star maintains identity/function across essentially the full perturbation spectrum it faces (the pressure-fusion thermostat self-corrects); perturbations within its normal environment do not destroy it. Exceptional multi-scale robustness (scale-4), far above the hurricane's fragile 1."}
    cascade_susceptibility: {score: 1, confidence: low, note: "Flares/coronal mass ejections involve magnetic-reconnection avalanche propagation informally discussed as cascades, but no fitted cross-event cascade-size distribution for a networked failure mode of the star exists. Scale-1 (propagation plausible/informally discussed, no dedicated size-distribution study), like the NYSE's pre-dataset situation but weaker."}
  river-networks:
    decentralization: {score: 4, confidence: high, note: "No controller: channel geometry emerges from local erosion-deposition physics; human works (levees, Old River Control) are boundary interventions, not internal steering components per the scoping note. No privileged controller at any scale (scale-4), unlike ERCOT's real-time operator (1)."}
    self_organization: {score: 4, confidence: high, note: "The dendritic channel network self-organizes from erosion-deposition feedback between flow and bed geometry with no template — a canonical geomorphic self-organized transport structure, matching the tropical-cyclones authorless-order 4, not the engineered ERCOT 1."}
    modularity: {score: 2, confidence: medium, note: "A river basin is strongly HIERARCHICAL (Strahler ordering) but only moderately MODULAR laterally — sub-basins are recognizable drainage subunits with more internal than cross-boundary flux, yet all drain through shared trunk channels. The anchor's note that a very hierarchical system can be only moderately modular points to scale-2, not the strongly-insulated 3."}
    nonlinearity: {score: 3, confidence: medium, note: "Sediment-transport and erosion laws are intrinsically nonlinear (threshold entrainment, stream-power laws), and network geometry selection is nonlinear pattern formation. Central to characteristic behavior (scale-3), like the fault system's rupture nonlinearity concentrated in events, below the pervasive-at-all-times hurricane 4."}
    criticality: {score: 2, confidence: low, note: "Fluvial landscapes and drainage networks are a classic scale-invariance domain (Hack's law, fractal channel networks, and SOC-style landscape-evolution models proposed by Rodriguez-Iturbe/Rinaldo), giving measured-grade scaling plus a proposed-but-contested SOC mechanism. Matches the earthquake score-2 (solid statistics, contested/untested mechanism)."}
    memory_hysteresis: {score: 3, confidence: low, note: "Channel form carries strong structural path-dependence (inherited planform, terraces, avulsion history) and delta lobe-switching shows regime-switching; the Old River near-avulsion is a documented bistable/threshold configuration. Documented path-dependent regime effects without a single canonical hysteresis width — scale-3, like the NYSE regime-scarring case."}
    feedback: {score: 3, confidence: medium, note: "The erosion-deposition-flow loop is continuously active and required (channel geometry sets flow which sets erosion which reshapes geometry), a genuine reinforcing/balancing loop pair. Multiple loops required to explain behavior (scale-3); below climate's 4 as loop structure is not the field's sole organizing device."}
    tipping_transitions: {score: 2, confidence: medium, note: "Avulsion (river jumping channels) and delta lobe-switching are specific, named, modeled threshold regime shifts, and the Old River Control near-avulsion makes one concretely citable per the brief — but no systematic multi-element inventory analogous to climate. Scale-2 (named mechanism + threshold, single/small set), matching the NYSE 2."}
    information_processing: {score: 0, confidence: high, note: "Water and sediment transport is pure physical flux with no detection step or state-dependent representational response — a channel does not 'read' a signal. The central-exclusion 0 (mass/momentum transport through a medium is not information processing), like the fault system's near-floor."}
    openness_dissipation: {score: 3, confidence: medium, note: "A river network is a dissipative structure: continuous water/sediment throughput (gravitational potential energy dissipated via friction and sediment work) carves and maintains the channel geometry; interrupting flow lets the structure degrade. Genuine Prigogine-sense dissipative structure (scale-3), below the hurricane's extreme-flux 4."}
    chaos_sensitivity: {score: 1, confidence: low, note: "Channel evolution is nonlinear and avulsion timing is hard to predict, but this reflects threshold/stochastic forcing and high-dimensionality more than a demonstrated low-dimensional chaotic attractor with exponential divergence; no measured river Lyapunov exponent. Scale-1 (weak/localized, sub-exponential), below the fault system's 2."}
    emergence: {score: 3, confidence: medium, note: "Drainage networks are described with genuine macro-laws doing real explanatory work — Horton's laws, Hack's law, fractal dimension, optimal-channel-network theory — not readable off local erosion rules by inspection. Formalized macro-descriptive machinery (scale-3), like Rayleigh-Benard, below a multi-theory 4."}
    adaptive_capacity: {score: 1, confidence: high, note: "The network configuration accommodates sustained forcing (channels widen, courses shift, profiles adjust to base level), but no component changes its RULE of behavior — pure structural accommodation. The scale's explicit 'channels widen' example caps this at 1, above climate's 0 only because reconfiguration is characteristic."}
    robustness_resilience: {score: 3, confidence: medium, note: "Drainage networks absorb the common flood/drought/sediment-pulse spectrum and recover geometry after large events, often with scars (terraces, cutoffs) — broad tolerance with hysteresis (scale-3). Judged against its own slow geomorphic perturbation spectrum, well above the hurricane's narrow-envelope 1."}
    cascade_susceptibility: {score: 1, confidence: low, note: "Knickpoint propagation and avulsion can propagate disturbance upstream/through the network and are informally discussed, but no fitted cross-event cascade-size distribution for river-network failure propagation exists. Scale-1 (propagation plausible/informally discussed, no dedicated size-distribution study), like the NYSE-adjacent lower cases."}
  cities:
    decentralization: {score: 3, confidence: medium, note: "Municipal government sets zoning/rules and operates some services (real but narrow-scope coordination, closer to rule-setting than moment-to-moment steering), while the characteristic dynamics — land market, commuting, agglomeration — are distributed decisions no one commands. Predominantly distributed with narrow coordination (scale-3), one above NYSE's 2 as no single matching-engine-like operator runs city dynamics."}
    self_organization: {score: 2, confidence: medium, note: "A designed skeleton (planned street grid, zoning, infrastructure) with substantial spontaneous order living on top — neighborhood formation, land-use segregation, scaling laws were not designed. Matches the scale-2 'designed substrate, undesigned characteristic phenomena,' like the Internet's self-organization treatment cited in the anchor notes."}
    modularity: {score: 3, confidence: medium, note: "Cities decompose into clearly recognizable, semi-autonomous neighborhoods/districts, and urban road-network community detection routinely finds high modularity (Louvain Q often 0.6-0.9+ in dense cities per the literature I checked). The anchor's own 'neighborhoods of a city' is listed as a scale-3 exemplar."}
    nonlinearity: {score: 3, confidence: medium, note: "Urban scaling laws (superlinear returns to size), congestion (nonlinear flow-density), and threshold tipping in segregation (Schelling) make nonlinearity central to characteristic behavior — scale-3. Held below 4 as much routine urban activity is quasi-linear; comparable to the fault-system placement."}
    criticality: {score: 1, confidence: low, note: "City-size (Zipf) and intra-urban distributions are heavy-tailed and sometimes given SOC-style growth models, but as a CRITICALITY claim the scale-invariant EVENT statistics + critical-mechanism consensus is weak and contested. Scale-1 (heavy tails observed, mechanism speculative), matching the NYSE criticality 1; static Zipf topology does not inflate this per the notes."}
    memory_hysteresis: {score: 4, confidence: medium, note: "Cities are dense structural fossils: street layout, lot lines, and building stock persist for centuries and demonstrably constrain present function (path-dependent 'lock-in' of infrastructure), plus documented hysteresis in land-value/decline regimes. The accumulated structural record that outlives perturbations and shapes present structure matches the scale-4 'lexical fossils / permanently altered structure' clause."}
    feedback: {score: 3, confidence: medium, note: "Multiple continuously-active loops: agglomeration (people attract jobs attract people, reinforcing), congestion and rent (balancing), gentrification/decline spirals. Required to explain urban dynamics (scale-3), like NYSE; below climate's 4 as the field does not treat loop structure as the single organizing device."}
    tipping_transitions: {score: 2, confidence: low, note: "Specific named regime-shift models exist — Schelling tipping in residential segregation, neighborhood tipping points, gentrification thresholds — modeled with thresholds, more than metaphor; but no systematic peer-reviewed inventory of N urban tipping elements. Scale-2 (named modeled mechanism, no systematic inventory), matching NYSE."}
    information_processing: {score: 4, confidence: medium, note: "A city aggregates dispersed partial information into constructed macro-states its agents act on — land prices/rents (a price-discovery analog), plus engineered layered channels (transit control, utility SCADA, markets). Combines dispersed sources into a state beyond a simple sum, matching the NYSE score-4 aggregation/inference case."}
    openness_dissipation: {score: 3, confidence: medium, note: "A city requires massive continuous physical throughput (electricity, fuel, food, water — NYC on the order of gigawatts) to maintain its organized structure; interrupting it degrades function fast (blackouts). Chaisson gives human society very high Phi_m. Genuine dissipative structure sustained by literal flux (scale-3), the flux more structure-supporting than the hurricane's structure-generating 4."}
    chaos_sensitivity: {score: 1, confidence: low, note: "Urban trajectories are hard to forecast, but this reflects human agency, stochastic forcing, and high dimensionality — not a demonstrated low-dimensional chaotic attractor with a measured Lyapunov exponent. Per the binding caution, general unpredictability is not chaos; scale-1, like the NYSE-adjacent low placements."}
    emergence: {score: 3, confidence: medium, note: "Cities are described with formalized macro-laws doing real predictive work — Bettencourt-West urban scaling exponents, Zipf's law, gravity/spatial-interaction models — not read off individual residents by inspection. Formalized order-parameter/effective-law machinery (scale-3), like Rayleigh-Benard; below a fully micro-intractable 4."}
    adaptive_capacity: {score: 4, confidence: medium, note: "Per the scoping note municipal institutions are internal (zoning revised, infrastructure hardened post-crisis) AND resident-agents and firms learn and revise strategies while selection reallocates activity — multi-level adaptation at component, population, and institutional levels, the full-CAS score-4 pattern mirroring NYSE (explicitly paralleled in the brief)."}
    robustness_resilience: {score: 3, confidence: medium, note: "Cities absorb the common shock spectrum (recessions, disasters, population swings) and recover function, often with scars (persistent blighted zones), over long lifetimes; major cities rarely die outright. Broad tolerance with hysteresis (scale-3), above ERCOT's 2 given demonstrated recovery from large shocks."}
    cascade_susceptibility: {score: 2, confidence: low, note: "Cascading failures are documented via case studies — infrastructure interdependency blackouts, financial-district contagion, evacuation gridlock — establishing cascades occur with characterized extent, but no fitted cross-event urban cascade-size distribution. Scale-2 (dedicated case studies, no fitted size-distribution), matching NYSE, above the power-grid's fitted-distribution 3."}
  the-internet:
    decentralization: {score: 3, confidence: high, note: "Coordination points (IANA/ICANN/IETF) set standards/naming but do not steer moment-to-moment BGP routing/traffic, which arises from distributed per-AS policy decisions. Predominantly distributed with narrow-scope coordination bodies (scale-3), explicitly the Internet case cited in the self_organization/decentralization anchor notes, above NYSE's operator-run 2."}
    self_organization: {score: 2, confidence: high, note: "A designed substrate (TCP/IP, BGP, engineered cables/routers) carries substantial spontaneous macro-structure — the AS-level topology, scale-free degree distribution, and peering ecology were not centrally designed. The anchor notes explicitly place the Internet at 2 here (designed substrate, spontaneous macro-structure)."}
    modularity: {score: 3, confidence: medium, note: "AS-level topology shows genuine community structure (Q typically >0.3, geography/economics driven per the literature I checked) with recognizable semi-autonomous clusters coupled through backbone providers. Strong modularity with clearly bounded subunits (scale-3), comparable to the power-grid 3; not the near-decomposable 4 given dense inter-AS peering."}
    nonlinearity: {score: 2, confidence: low, note: "Core packet forwarding/routing is largely linear/additive, but congestion control (TCP's multiplicative-decrease), congestion collapse thresholds, and BGP route-flap instability are genuinely nonlinear in specific regimes/episodes. Nonlinear terms shape secondary/occasional behavior while modal dynamics are quasi-linear (scale-2), below the fault/hurricane 3-4."}
    criticality: {score: 1, confidence: low, note: "Traffic self-similarity and topology scale-freeness are documented, and congestion-collapse SOC analogies have been proposed, but scale-invariant EVENT statistics with a consensus critical mechanism are not established (static scale-free topology is explicitly out of scope for this column per the notes). Scale-1, like NYSE."}
    memory_hysteresis: {score: 3, confidence: low, note: "The topology bears strong structural path-dependence — early peering decisions, legacy address allocations, and installed cable geography persist and shape present routing (the anchor lists the Internet as a structural path-dependence case). Documented but localized/partial path-dependence without a canonical quantified loop — scale-3."}
    feedback: {score: 3, confidence: medium, note: "Multiple continuously-active loops are required: TCP congestion control (balancing: loss/RTT throttles sending rate), BGP route selection/withdrawal dynamics, and growth-attracts-peering (reinforcing preferential attachment). Removing them qualitatively changes behavior (scale-3); below the totalizing hurricane/climate 4."}
    tipping_transitions: {score: 2, confidence: low, note: "Congestion collapse is a specific named, modeled regime shift (1980s NSFNET collapse, motivating congestion control) with an identified threshold, and routing-instability cascades are studied — more than metaphor but a small ad hoc set, not a systematic inventory. Scale-2 (named modeled mechanism, no inventory), matching NYSE."}
    information_processing: {score: 4, confidence: medium, note: "The Internet runs rich multi-channel processing beyond signal relay: routing tables aggregate reachability information, congestion-control protocols adapt to inferred network state, and the same packet is routed differently by receiver/router state. Protocol-level congestion control adapting to network state is the anchor's own scale-4 example; the notes expect the Internet in the 3-4 range."}
    openness_dissipation: {score: 2, confidence: medium, note: "The physical substrate (routers, data centers, cables) draws continuous large electrical power, but that throughput sustains the COMPUTING SUBSTRATE rather than generating the network's characteristic topological/routing dynamics (an information process layered on top). Matches the NYSE score-2 reasoning exactly (real dissipation, infrastructure-support not structure-generating)."}
    chaos_sensitivity: {score: 1, confidence: low, note: "BGP dynamics and traffic bursts are complex and bursty, but this reflects high-dimensional stochastic load and policy interaction, not a demonstrated low-dimensional chaotic attractor with a measured Lyapunov exponent. General unpredictability is not chaos per the binding rule — scale-1."}
    emergence: {score: 3, confidence: medium, note: "Describing the Internet requires genuinely new macro-machinery doing real work — scale-free degree distribution, graph-theoretic community/hierarchy structure, self-similar traffic — not read off per-AS config by inspection. The anchor explicitly notes an engineered/designed topology can still score high on emergence via necessary graph-theoretic description (scale-3)."}
    adaptive_capacity: {score: 2, confidence: medium, note: "Network components systematically change behavior via feedback/selection among fixed rules — TCP adjusts rates, BGP re-routes around failures, operators retune peering after outages — without anticipatory internal models at the protocol level. Scale-2 (feedback/selection among fixed rules, no anticipation), like ERCOT, below NYSE's strategic 4."}
    robustness_resilience: {score: 4, confidence: medium, note: "The Internet was engineered for and demonstrates exceptional survivability — routing reroutes around node/link loss, and it maintains global function across the near-full perturbation spectrum it faces (outages, attacks, cable cuts) over its lifetime. Exceptional multi-scale robustness (scale-4); the scale-free topology's resilience to random failure supports this."}
    cascade_susceptibility: {score: 2, confidence: low, note: "Cascading failures are documented via case studies and simulation — BGP route-withdrawal storms, congestion-collapse propagation, correlated outages — establishing cascades occur with characterized extent, but I am not aware of a fitted cross-event cascade-size distribution to primary Internet data. Scale-2 (dedicated studies, no fitted size-distribution), below the power-grid's measured 3."}
  languages:
    decentralization: {score: 4, confidence: high, note: "No privileged controller: language change arises from distributed usage decisions across the whole speech community; prescriptive academies/dictionaries are marginal and do not steer moment-to-moment usage. No controller at any scale (scale-4), well below ERCOT's real-time operator 1 — even standards bodies here are weaker than protocol registries."}
    self_organization: {score: 4, confidence: high, note: "Grammar, phonology, and lexical structure self-organize from distributed speaker interaction with no designer or blueprint (constructed languages are out of scope); characteristic structure is essentially all spontaneous. Scale-4 authorless order, like tropical cyclones — academies template only marginal spelling conventions."}
    modularity: {score: 2, confidence: low, note: "Linguistic structure decomposes into recognizable subsystems (phonology, morphology, syntax, lexicon) with more internal than cross-level coupling, and word co-occurrence/semantic networks show community structure — but the modules interact heavily and boundaries shift, so moderate identifiable modularity (scale-2), not the strongly-insulated 3."}
    nonlinearity: {score: 1, confidence: low, note: "Per the anchor's explicit note that English can score LOW on nonlinearity while high elsewhere: the governing 'equations' are not intrinsically nonlinear in the mechanistic sense; frequency dynamics and change involve some threshold effects but linear/statistical description captures the modal behavior. Scale-1 (nonlinear terms weak/peripheral), the anchor's stated language case."}
    criticality: {score: 1, confidence: low, note: "Word-frequency distributions are famously power-law (Zipf), giving heavy-tailed STATISTICS, but as a CRITICALITY/SOC claim (scale-invariant EVENT dynamics with a critical mechanism) there is no consensus mechanism — Zipf is a static distribution, not a critical event process. Scale-1 (heavy tails present, mechanism weak/speculative), like NYSE; static distribution does not inflate this."}
    memory_hysteresis: {score: 4, confidence: medium, note: "Languages carry deep structural path-dependence directly used to reconstruct history — lexical fossils, loanword strata, irregular forms, and comparative reconstruction all read present structure as an accumulated historical record. This is precisely the anchor's scale-4 'lexical fossils / accumulated structural record that is itself the primary evidence for the system's history' clause."}
    feedback: {score: 2, confidence: low, note: "Usage-frequency loops exist (frequent forms resist change / high-frequency words shorten — a reinforcing loop) and social prestige loops shape adoption, but much change is driven by open-loop transmission/drift across generations rather than continuous system-level loops. Loops matter in identifiable regimes (scale-2), below the multi-loop-required 3."}
    tipping_transitions: {score: 2, confidence: low, note: "Specific named regime-shift mechanisms are modeled — sound-change actuation/S-curve adoption, language death/shift tipping thresholds, creolization — more than metaphor, with threshold structure; but no systematic peer-reviewed inventory of N linguistic tipping elements. Scale-2 (named modeled mechanism, no systematic inventory), matching NYSE."}
    information_processing: {score: 4, confidence: high, note: "Language is the paradigm meaning-construction system: it composes novel sentences never seen before via combinatorial grammar, and the same signal is disambiguated by context (receiver state) — the anchor's own scale-4 examples ('semantic composition of novel sentences,' 'grammatical disambiguation by context') name language/parsing directly."}
    openness_dissipation: {score: 1, confidence: low, note: "The physical transmission substrate (air, ink, screens) carries some literal energy flux, but this throughput is not what maintains the language's characteristic structure — the code persists in distributed knowledge independent of any single transmission event. Measurably open but throughput peripheral to structure (scale-1), near the fault-system floor; the substrate is recorded here only nominally per scoping."}
    chaos_sensitivity: {score: 0, confidence: low, note: "No evidence of sensitive dependence on initial conditions in language dynamics: change is dominated by stochastic transmission, social forcing, and drift, not internal exponential amplification of small differences, and no Lyapunov exponent is defined. Predictability is limited by data/agency, not trajectory divergence — scale-0."}
    emergence: {score: 3, confidence: medium, note: "Describing a language requires genuine macro-level regularities not read off individual utterances — Zipf's law, entropy-rate/predictability measures, and typological/grammatical universals are formalized order-parameter-like descriptions doing real work. Formalized macro-descriptive machinery (scale-3), like Rayleigh-Benard, below a fully micro-intractable 4."}
    adaptive_capacity: {score: 4, confidence: medium, note: "With speakers as interacting agents (per the dual-ontology scoping) language shows pervasive multi-level adaptation: speakers revise usage from communicative outcomes, variants are selected/retained or lost (variation-selection), and the population of forms itself evolves over generations. Multi-level learn-and-select (scale-4), the full-CAS pattern like NYSE."}
    robustness_resilience: {score: 3, confidence: medium, note: "Languages absorb heavy perturbation — massive borrowing, contact, sound change, population disruption — and maintain communicative function/identity over centuries, recovering with scars (substrate influence). Broad tolerance with hysteresis judged against its own slow perturbation spectrum (scale-3); not 4 since contact/shift can extinguish a language within its normal environment."}
    cascade_susceptibility: {score: 1, confidence: low, note: "Change can propagate through the lexicon/social network (chain shifts, analogical leveling spreading across a paradigm; adoption diffusing through a community), informally discussed as propagation, but no fitted cross-event cascade-size distribution for linguistic change exists. Scale-1 (propagation plausible/informally discussed, no dedicated size-distribution study)."}
