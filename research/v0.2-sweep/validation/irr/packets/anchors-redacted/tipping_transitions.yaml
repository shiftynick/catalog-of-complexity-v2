column: tipping_transitions
version: 0.1-draft
scale:
  0: >
    No regime shift, bifurcation, or multi-stable behavior has been proposed
    or documented for this system in the primary literature; the system's
    dynamics are treated as smoothly/monotonically responsive to forcing
    across the observed range, with no theoretical or empirical basis offered
    for a sharp qualitative-state change.
  1: >
    "Tipping point" language is applied informally/metaphorically (popular
    or narrative usage) but no specific bifurcation, alternative stable state,
    or regime-shift mechanism has been formally identified or modeled for
    this system; OR a single plausible qualitative-shift mechanism is
    speculated in passing without dedicated study.
  2: >
    At least one specific regime shift or tipping element is formally
    identified and modeled (a named mechanism, a proposed or estimated
    threshold, published in the primary literature), but it remains a single
    case or small ad hoc set rather than a systematic inventory, and/or
    empirical confirmation (an actually observed transition, not just a
    model prediction) is thin or absent.
  3: >
    A systematic inventory of multiple tipping elements/regime shifts exists
    for this system or system-class in the peer-reviewed literature (a
    citable count, e.g. from a dedicated synthesis paper), with named
    mechanisms and threshold estimates for each; at least one instance shows
    empirical evidence consistent with approach-to-transition (e.g. critical
    slowing down: rising variance/autocorrelation) even if full confirmation
    (an observed completed transition matching the predicted mechanism) is
    still pending for most elements.
  4: >
    A systematic, actively maintained inventory of tipping elements exists
    (as in level 3) AND at least one element has empirically documented
    critical-slowing-down or other early-warning-signal evidence tied to a
    quantified threshold estimate, with the framework subject to ongoing
    primary-literature revision (count updated as evidence accumulates).
    Reserved for climate; no other system in this catalog is expected to
    reach this level given current literature.
does_not_count: |
  Colloquial "tipping point" rhetoric (news/popular usage applied to markets, cities,
  social trends) does not by itself earn more than a 1 — this column requires a named
  mechanism and, for scores >=2, a specific threshold or bifurcation structure in the
  primary literature (per Scheffer et al. 2009's generic early-warning-signal
  framework). Do not conflate with criticality: a tipping element need not be
  scale-invariant or power-law-distributed (AMOC collapse is a single sharp
  bifurcation, not an event-statistics phenomenon) — see criticality.yaml for that
  separate claim. Do not conflate with cascade_susceptibility: a cascade is a
  failure-propagation process through a networked system, which may never involve a
  genuine alternative stable state — see cascade_susceptibility.yaml. Predictive
  claims from the discredited deterministic earthquake-prediction literature (Geller et
  al. 1997, Science 275:1616) must not be cited as evidence of tipping-point structure
  for fault systems.
anchors:
  - system: planetary-climate
    exemplar: "Earth"
    category: geophysical
    score: 4
    justification: >
      Armstrong McKay et al. (2022, Science 377:eabn7950) synthesized 200+
      studies to identify 16 climate tipping elements (9 global "core" + 7
      regional "impact"), updated from Lenton et al.'s original 9 (2008, PNAS
      105:1786) — a citable, revised-in-the-literature count with named
      mechanisms (e.g. AMOC collapse, Greenland/WAIS ice-sheet loss, Amazon
      dieback) and threshold estimates in degrees C of warming. Several
      elements are assessed as already within their uncertainty range for
      triggering at ~1.1 C observed warming. AMOC hysteresis has been
      quantified in a state-of-the-art GCM (van Westen et al. 2023, GRL,
      arXiv:2308.14098; ~0.4 Sv hysteresis width, model-derived, asymmetric
      collapse/recovery). This is the calibration ceiling case the scale-4
      definition is written around.
    evidence_status: measured
    sources: [lenton2008, mckay2022]
  - system: earthquake-fault-systems
    exemplar: "San Andreas Fault"
    category: geophysical
    score: 1
    justification: >
      No systematic inventory of "tipping elements" analogous to the climate
      literature exists for fault systems. Individual earthquakes are
      discrete stress-release events on a driven system, not documented
      alternative-stable-state transitions; some exploratory work applies
      critical-slowing-down-style precursor indicators to seismic catalogs,
      but this sits adjacent to the deterministic earthquake-prediction
      literature that Geller et al. (1997, Science 275:1616) showed to be
      unreliable, and per this column's does_not_count clause is not treated
      as established evidence. Scored 1: informal "the fault is due for a
      big one" tipping-adjacent language exists in public discourse, no
      formal regime-shift inventory or confirmed bifurcation structure.
    evidence_status: qualitative
    sources: []
  - system: financial-markets
    exemplar: "New York Stock Exchange"
    category: socio-economic
    score: 2
    justification: >
      Scheffer et al. (2009, Nature 461:53) explicitly propose their generic
      early-warning-signal framework (critical slowing down, rising
      variance/autocorrelation, flickering) as applicable to financial
      markets, and specific regime-shift models exist for market crashes
      (e.g. bubble-crash models with identified fragile states) — this is
      more than metaphor. However, robust EMPIRICAL confirmation of
      critical-slowing-down ahead of an actual historical crash remains
      thin/contested relative to the climate/ecology literature, and there is
      no systematic, citable inventory of "N market tipping elements"
      analogous to Lenton/McKay. Scored 2: named mechanism and modeled
      threshold concept exist for individual cases (e.g. 1987, 2008), not yet
      a systematic multi-element inventory with empirical confirmation.
    evidence_status: qualitative
    sources: []
  # [redacted for blind IRR study — worked example removed]
  # [redacted for blind IRR study — worked example removed]
notes: |
  This column is about STATE-SPACE regime shifts (bifurcations, alternative stable
  states, hysteresis loops) — distinct from criticality (scale-invariant EVENT
  statistics / SOC, which need not involve any alternative stable state at all: G-R
  earthquake statistics are about event SIZE distribution, not the fault switching
  between qualitatively different regimes) and from cascade_susceptibility (failure
  PROPAGATION through a coupled/networked system, which can occur without any
  bistability). memory_hysteresis is the closest sibling column and deliberately
  overlaps at the evidentiary level (AMOC's ~0.4 Sv hysteresis width is cited in both);
  the distinction is that tipping_transitions asks "how many/well-characterized are the
  regime-shift mechanisms," while memory_hysteresis asks "how much does system history
  persist in current state" more generally (including non-bifurcation path-dependence
  like traffic-flow hysteresis loops, which need not imply a true tipping point).
  Boundary case: ERCOT grid voltage collapse has real bifurcation theory behind it
  (saddle-node voltage collapse is textbook power-systems dynamics) and could arguably
  score >=2 with a dedicated per-system literature search; it is not used as a worked
  anchor here for lack of a specific citation verified in Phase 1 research — flag for
  Phase 2 follow-up rather than guessing a score.
sources:
  lenton2008: "Lenton, T.M. et al. (2008). Tipping elements in the Earth's climate system. PNAS 105(6), 1786."
  mckay2022: "Armstrong McKay, D.I. et al. (2022). Exceeding 1.5C global warming could trigger multiple climate tipping points. Science 377(6611), eabn7950."
