# ============================================================
# Catalog of Complexity — Rubric Anchors: information_processing
# ============================================================
# Spec definition (panel-spec.yaml, group D): Degree to which the system
# detects, transmits, and responds to information in a STATE-DEPENDENT way.
# Strict anchors required: mere signal/energy propagation does NOT count.
# 0-1 scores for the Sun and fault systems are expected and informative,
# not category errors.
# ============================================================

column: information_processing
version: 0.1-draft

scale:
  0: >
    No detection step exists. Physical influences propagate and cause
    effects purely as forced responses (energy/momentum/field transfer)
    with no intervening representation, threshold, or comparison against a
    reference state. The output is a direct physical function of the input
    disturbance's magnitude, not of any internal state the system
    "checks." Waves passing through a medium, heat conduction, and direct
    mechanical stress transfer are canonical 0s.
  1: >
    Threshold-triggered response only: the system's output changes
    discontinuously once an input crosses a fixed physical threshold (a
    switch, not a channel), but there is no channel carrying a symbol
    distinguishable from the triggering energy itself, no
    storage-and-later-use of what was detected, and no combination of
    multiple inputs into a representation. This is "sensing" in only the
    thinnest sense — a rupture criterion, a critical Rayleigh number,
    a fixed melting point.
  2: >
    Genuine but narrow signaling: a detectable, quasi-independent channel
    exists (a signal whose amplitude/timing is somewhat decoupled from the
    raw energy that carries it) and evokes a state-dependent response
    (the SAME input signal produces different responses depending on the
    receiver's internal state), but the repertoire is small (few
    signal/response types), local, and mostly hardwired/reflexive rather
    than combinatorial or contextual.
  3: >
    A working signaling/detection system with state-dependent, somewhat
    contextual responses across multiple channels or agents: information
    is transmitted through a structure that is at least partly decoupled
    from direct energy transfer (a dedicated channel/protocol/institution),
    responses integrate more than one input, and the same signal can
    produce different downstream effects depending on receiver state or
    context (routing tables, price responses, grammatical disambiguation
    by context).
  4: >
    Rich, multi-channel information processing with aggregation,
    inference, or meaning-construction beyond the immediate signal:
    the system combines dispersed, partial information from many sources
    into a state that is not a simple sum of inputs (price discovery,
    protocol-level congestion control adapting to network state, semantic
    composition of novel sentences never seen before), and downstream
    behavior is demonstrably conditioned on this constructed state rather
    than on raw input magnitude.

does_not_count: |
  THE CENTRAL EXCLUSION FOR THIS COLUMN: mere propagation of energy, mass,
  or a physical field through a medium is NOT information processing,
  regardless of how structured or wave-like it looks. A pressure wave
  crossing a fluid, radiation diffusing through stellar plasma, elastic
  stress redistributing across a fault plane, and heat advecting through
  ocean currents are all physical transport, not detection-transmission-
  response in a STATE-DEPENDENT sense — score them by whether a
  DOWNSTREAM state-dependent response exists, not by the sophistication of
  the propagation physics. A fixed physical threshold (boiling point,
  fracture strength, Reynolds-number transition) is a bifurcation in the
  dynamics, not "detection" — score such triggers at 1, not higher, even
  if the resulting pattern looks organized (see emergence for that). Do
  not award points for "the system carries a lot of Shannon entropy" —
  entropy/complexity of the signal is not the same as the system USING
  that information to condition a response; a firehose is not a
  processor. Do not double-count feedback (group C) here: a feedback loop
  is a causal loop; information_processing additionally requires that
  what loops back function as a signal/representation the receiver's
  response depends on, not just a physical quantity re-entering the
  dynamics (e.g., ice-albedo feedback is feedback, not information
  processing — nothing "reads" the albedo as a symbol).

anchors:
  # [redacted for blind IRR study — worked example removed]

  - system: earthquake-fault-systems
    exemplar: "San Andreas Fault"
    category: geophysical
    score: 1
    justification: >
      Rupture initiates when local shear stress on a fault patch exceeds
      the frictional strength threshold (rate-and-state friction); this is
      a physical threshold trigger, not detection in any representational
      sense — no channel carries a "signal" distinguishable from the
      stress itself, and there is no storage of a signal for later
      conditional use beyond the stress state itself (which is
      memory_hysteresis's province, not this column's). Static and dynamic
      stress transfer to neighboring segments after a rupture (triggering
      aftershocks or remote earthquakes) is the same physical-propagation
      story as the Sun's radiative transport, just via elastic waves and
      Coulomb stress change rather than photons. Scored 1, not 0, because
      the rate-and-state threshold is at least a discrete
      trigger/comparison against a reference friction value, matching the
      scale's level-1 definition; still far below anything that could be
      called signaling.
    evidence_status: qualitative
    sources: []

  # [redacted for blind IRR study — worked example removed]

  - system: power-grids
    exemplar: "ERCOT (Texas Interconnection)"
    category: infrastructure
    score: 3
    justification: >
      The grid runs an explicit, engineered information layer distinct
      from the power flow itself: SCADA telemetry detects frequency and
      voltage deviations, automatic generation control and
      under-frequency load shedding respond in a state-dependent way (the
      SAME frequency deviation triggers different responses depending on
      time of day, prior commitments, and market state), and ERCOT's
      real-time market clears using bid/offer signals that are informational
      constructs layered on top of, and partly decoupled from, the
      physical electron flow. This is well above threshold-triggering
      because there are multiple integrated channels (telemetry, market
      bids, protection relays) and genuinely conditional responses. Held
      at 3 rather than 4 because the core physical control (frequency
      regulation via governor droop) still has a large hardwired,
      reflexive component rather than being fully aggregative/inferential.
    evidence_status: qualitative
    sources: []

  - system: financial-markets
    exemplar: "New York Stock Exchange"
    category: socio-economic
    score: 4
    justification: >
      Price discovery is the textbook case of aggregating dispersed,
      partial private information (about firm value, macro conditions,
      order flow) held by thousands of independent traders into a single
      public statistic (the price) that is not a simple sum of any one
      participant's input — this is Hayek's "information aggregation"
      function of markets, operationalized continuously via the limit
      order book. Market participants condition behavior on the
      constructed state (the current price, order-book depth, volatility
      regime) rather than on raw fundamentals directly, and the same news
      event produces different price responses depending on prevailing
      market regime (state-dependence). This is qualitatively different
      from and beyond mere signal transmission — it is inference and
      aggregation, matching the top of the scale exactly.
    evidence_status: qualitative
    sources: []

  # [redacted for blind IRR study — worked example removed]

notes: |
  This is the column most at risk of "impressive system therefore high
  score" contamination; the does_not_count block is load-bearing and
  should be checked first for every entry. The Sun and San Andreas anchors
  are deliberately low per the spec's explicit instruction — a verifier
  agent seeing 0/1 scores for these two should NOT flag them as
  suspiciously low; the reverse (a 3 or 4 for either without a genuine
  representational/detection layer) is the actual red flag. Distinguish
  from group-C feedback: feedback is about causal loop structure (does X
  affect Y affect X); information_processing additionally requires a
  detection-response step where the response depends on the receiver's
  STATE, not just the loop's existence (see does_not_count on ice-albedo
  feedback). Distinguish from memory_hysteresis: storing a value is not
  processing it — a fault's accumulated stress is memory (scored there);
  only a system that detects and conditionally responds to that stored
  value as a distinguishable signal would additionally score here.
  Engineered systems (ERCOT, Internet — not separately anchored above but
  expected to land in the 3-4 range for the same SCADA/protocol reasons as
  ERCOT) tend to score high because their information layers are
  deliberately engineered and legible; this is a real asymmetry versus
  purely physical systems, not a scoring artifact to correct for.
