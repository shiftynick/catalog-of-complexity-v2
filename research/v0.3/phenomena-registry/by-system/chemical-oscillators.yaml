system: chemical-oscillators
phenomena:
  - id: chemical-oscillators--temporal-oscillation
    name: Temporal oscillation (color-cycling)
    order_parameter: oscillation period and amplitude of the indicator redox potential (ferroin/ferriin or Ce3+/Ce4+ ratio)
    substrate:
      part_type: substrate/oxidant/catalyst molecules and ions (bromate, malonic acid, cerium or ferroin, bromide, bromous acid, and other Oregonator-model intermediates)
      count_oom: "~1e22-1e23 (1 L batch, see numerosity)"
      interchangeable: no
    generating_interactions: [autocatalytic amplification, inhibitory bromide regeneration]
    novelty_kind: new-dynamics
    onset: threshold-bifurcation
    onset_control_parameter: >
      Hopf bifurcation governing oscillation onset, analyzed in Oregonator
      parameter space (reagent concentrations / flow rate) — Field & Noyes
      1974 (fn1974) [snippet-verified — title/existence confirmed via
      search; not primary-read this sweep, per the host entry's read-status
      annotation]. This is the host's tipping_transitions score-2 mechanism:
      "a named mechanism with a threshold in the control-parameter space
      ... published and modeled."
    persistence: sustained-while-driven
    effective_theory:
      status: quantitative-predictive
      theory: >
        the Oregonator limit-cycle model (fn1974) atop the FKN mechanism
        (fkn1972); host emergence block: "formalized, predictive macro-level
        descriptions ... the actual working vocabulary the field uses"
    qualitative_difference: >
      A single molecule undergoes individual reaction events with no period;
      the bulk oscillation is a collective limit cycle of the whole reacting
      medium — the beaker "ticks," swinging its redox state back and forth
      with a measurable period and amplitude generated entirely by the
      coupled autocatalytic and delayed-inhibitory kinetics (host summary:
      "nothing external times the beat"). Period is a property no molecule
      has.
    justification: >
      novelty_kind new-dynamics: the order parameter (period and amplitude)
      is a pure time-signature, the spec's own test case. onset
      threshold-bifurcation: the Hopf bifurcation (fn1974) is a named,
      formally modeled threshold carried by the host's tipping_transitions.
      persistence sustained-while-driven, NOT self-sustaining — recorded
      per the host scoping_note's explicit ruling: the batch regime damps
      out as reagents are irreversibly consumed (transient train, ~1e3-1e4
      s), and the CSTR regime oscillates only while fresh reagent is
      continuously pumped; "Neither regime is 'self-sustaining' in this
      catalog's autonomous-once-formed sense ... externally driven exactly
      as a hurricane requires ocean heat flux." The single recorded value
      takes the CSTR (sustained-while-driven) reading, with the batch
      regime's transient reading preserved here rather than blended,
      mirroring the host's own openness_dissipation convention.
    confidence: high

  - id: chemical-oscillators--trigger-spiral-target-waves
    name: Trigger/spiral/target waves
    order_parameter: wave-front propagation speed; spiral-core rotation period
    substrate:
      part_type: substrate/oxidant/catalyst molecules and ions (bromate, malonic acid, cerium or ferroin, bromide, bromous acid, and other Oregonator-model intermediates)
      count_oom: "~1e22-1e23 (1 L batch, see numerosity)"
      interchangeable: no
    generating_interactions: [autocatalytic amplification, inhibitory bromide regeneration, molecular diffusion]
    novelty_kind: new-entity
    onset: unknown
    persistence: sustained-while-driven
    effective_theory:
      status: quantitative-predictive
      theory: >
        excitable-medium wave theory atop the Oregonator (host emergence
        block names "excitable-medium wave theory" as working vocabulary
        that predicts wave speed; fn1974; primary wave papers
        zaikin-zhabotinsky1970 and winfree1972, both [unverified — model
        knowledge] per the host's annotations)
    qualitative_difference: >
      A single molecule diffuses and reacts locally; a spiral or target wave
      is a persistent, localized, individuable macro-object — you can point
      at one spiral, count the spirals and target rings in a dish, and track
      a given spiral core's rotation over time as it "crawls across the
      dish" (host summary) — with its own propagation speed (~1-10 mm/min,
      host timescales) and core rotation period that no molecule possesses.
    justification: >
      novelty_kind new-entity: spiral cores and target patterns pass the
      spec's strict point/count/track test — they are the registry's
      cleanest chemical example of trackable localized objects; runner-up
      new-dynamics for the rotation-period framing, but the phenomenon is
      the objects, not the regime. onset unknown — the conservative choice
      per spec: the host entry says the waves "assemble spontaneously" in
      UNSTIRRED thin layers (a regime condition, not a control parameter)
      and cites no threshold, bifurcation analysis, or excitability
      criterion for wave initiation anywhere in its attributes or sources;
      episodic-triggered (waves nucleating from local perturbations) is
      plausible from the "trigger wave" name alone but would rest on a
      claim the entry does not carry. persistence sustained-while-driven:
      waves propagate only while the medium's chemical-potential throughput
      lasts (batch thin-layer waves die with reagent exhaustion, per the
      scoping_note's regime ruling on the parent chemistry).
    confidence: medium

  - id: chemical-oscillators--turing-pattern
    name: Turing pattern (CIMA/gel-reactor variant)
    order_parameter: stationary pattern wavelength (hexagonal/striped)
    substrate:
      part_type: substrate/oxidant/catalyst molecules and ions (bromate, malonic acid, cerium or ferroin, bromide, bromous acid, and other Oregonator-model intermediates)
      count_oom: "~1e22-1e23 (1 L batch, see numerosity)"
      interchangeable: no
    generating_interactions: [autocatalytic amplification, inhibitory bromide regeneration, molecular diffusion]
    novelty_kind: new-structure
    onset: threshold-bifurcation
    onset_control_parameter: >
      Turing (reaction-diffusion) instability of the uniform state — Ouyang
      & Swinney 1991, "Transition from a uniform state to hexagonal and
      striped Turing patterns" (ouyang-swinney1991) [snippet-verified —
      title and existence confirmed via search, per the host's annotation].
      The instability is a named, published bifurcation of the uniform
      state, but the host entry pins no numerical critical value for the
      controlling parameter (and deliberately withholds the ~0.2 mm
      wavelength figure as unconfirmed) — the citation is at the
      qualitative-bifurcation level the entry itself supports, per the
      tropical-cyclones registry precedent.
    persistence: sustained-while-driven
    effective_theory:
      status: vocabulary
      theory: >
        Turing/reaction-diffusion instability framework (ouyang-swinney1991;
        host self_organization: "a spatial pattern can emerge purely from
        reaction-diffusion instability with zero external templating") —
        held at vocabulary rather than quantitative because the host entry
        carries no confirmed quantitative prediction (the wavelength value
        was explicitly withheld as unverified)
    qualitative_difference: >
      Individual molecules react and diffuse isotropically with no
      preferred length scale; the Turing pattern is a STATIONARY spatial
      organization — hexagons or stripes with a selected wavelength — that
      the initially uniform medium builds and holds against diffusion,
      the first experimental realization of Turing's instability
      (ouyang-swinney1991). No molecule has a wavelength or a lattice
      position.
    justification: >
      novelty_kind new-structure (runner-up new-entity, since individual
      spots/stripes are countable): the order parameter is a quasi-static
      spatial wavelength and the pattern is stationary — the spec's
      "quasi-static spatial organization accreted by the dynamics" — rather
      than a moving trackable object or a time-signature. onset
      threshold-bifurcation: the Turing instability is by construction a
      bifurcation of the uniform state and the host cites the transition
      paper directly (ouyang-swinney1991); recorded with the qualitative
      caveat above since no numerical critical parameter value exists in
      the entry. persistence sustained-while-driven: the gel reactor is
      continuously fed; the pattern is a maintained dissipative structure,
      not a frozen record — it does not survive reagent cutoff.
    confidence: medium

  - id: chemical-oscillators--period-doubling-chaos
    name: Period-doubling route to chaos (CSTR regime)
    order_parameter: bifurcation-parameter (flow rate) indexed period sequence; reconstructed attractor dimension
    substrate:
      part_type: substrate/oxidant/catalyst molecules and ions (bromate, malonic acid, cerium or ferroin, bromide, bromous acid, and other Oregonator-model intermediates)
      count_oom: "~1e22-1e23 (1 L batch, see numerosity)"
      interchangeable: no
    generating_interactions: [autocatalytic amplification, inhibitory bromide regeneration, continuous feed/removal (CSTR regime only)]
    novelty_kind: new-dynamics
    onset: threshold-bifurcation
    onset_control_parameter: >
      CSTR flow rate as the bifurcation parameter of an experimentally
      demonstrated period-doubling cascade to chaos — Simoyi, Wolf &
      Swinney 1982, PRL 49:245 (sws1982) [snippet-verified — abstract text
      retrieved directly via search, per the host's annotation; companion
      attractor-reconstruction paper rss1983 remains unverified — model
      knowledge, a standing verification debt flagged by the host].
    persistence: sustained-while-driven
    effective_theory:
      status: quantitative-predictive
      theory: >
        one-dimensional return-map description of the experimental time
        series (sws1982; host chaos_sensitivity: "dynamics well-described
        by a one-dimensional map," an experimentally reconstructed
        low-dimensional attractor, evidence_status measured)
    qualitative_difference: >
      No molecule's kinetics contain a period-2, period-4, ... cascade or a
      strange attractor; the period-doubling sequence is a collective
      bifurcation structure of the whole driven medium's limit cycle,
      traversed as an external flow rate is tuned — a time-signature of the
      bulk dynamics that exists at no molecular scale.
    justification: >
      novelty_kind new-dynamics: the order parameter (a bifurcation-indexed
      period sequence and attractor dimension) is entirely a time-signature/
      regime object, the spec's clearest test. onset threshold-bifurcation:
      the cascade is literally a sequence of published bifurcations in a
      named control parameter (flow rate), with the strongest read-status in
      this entry (directly retrieved abstract, sws1982). persistence
      sustained-while-driven: the phenomenon exists only in the pumped CSTR
      regime — the host notes the batch regime "never sustains oscillation
      long enough to exhibit period-doubling" (chaos_sensitivity flag).
    confidence: high
