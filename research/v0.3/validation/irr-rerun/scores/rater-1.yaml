scores:
  stars:
    criticality: {score: 0, rationale: "Brief describes structural zones (core, convective zone) and magnetic activity cycle but no scale-invariant event statistics or SOC/critical-point mechanism. Boundary rule 'events-not-structure': magnetic activity cycle is a mechanism description, not event-dynamics evidence. No published criticality claim for stars."}
    tipping_transitions: {score: 0, rationale: "Brief scopes system to 'mature main-sequence star' and explicitly excludes evolutionary transitions (subgiant/red giant) as 'not scored as this entry's characteristic dynamics.' No bifurcation, alternative stable state, or regime-shift mechanism proposed for main-sequence star dynamics."}
    emergence: {score: 3, rationale: "Stars fundamentally described via formalized macro-level effective theories (stellar structure models, hydrostatic/thermal equilibrium, convection theory, magnetic dynamo theory) that are the PRIMARY mode of astrophysical study. Micro-level simulation from first principles is intractable. Multiple order parameters (luminosity, effective temperature, magnetic field strength) characterize macro-behavior used predictively by field."}
  river-networks:
    criticality: {score: 0, rationale: "Brief discusses static structural scaling (Horton's laws, Strahler ordering) but boundary rule 'events-not-structure' explicitly excludes 'fractal geometry (drainage-network Horton ratios)...This column requires scale-invariant statistics of EVENTS.' No event-statistics or SOC mechanism mentioned for fluvial dynamics."}
    tipping_transitions: {score: 1, rationale: "Exemplar note states Old River Control Structure 'makes tipping_transitions concretely citable' via near-avulsion event; scoping note confirms avulsion risk is a system concern. However, no formal bifurcation analysis, threshold estimate, or published mechanism for avulsion as regime-shift is described. Boundary rule 'single-modeled-mechanism-is-2': informal/citable tipping language without dedicated formal study = 1."}
    emergence: {score: 2, rationale: "Dendritic network is recognizable macro-pattern not obviously predictable from micro-rules (water/sediment particles). Practitioners use pattern-specific vocabulary (tributaries, confluences, meanders). Horton's laws provide quantitative relationships, but these are empirical scaling patterns rather than dynamical order parameters with independent quantitative content in the emergence sense (cf. Rayleigh number in convection)."}
  cities:
    criticality: {score: 0, rationale: "Brief mentions 'scaling laws, land use, commuting' and 'Zipf-law class-statistical claim.' Zipf-law is rank-size distribution across instances (class-level), not scale-invariant event statistics within a scoped city. Boundary rule 'events-of-the-scoped-system': 'A distribution ACROSS instances of the class...is not evidence that the scoped system sits near a critical point.' No criticality mechanism proposed."}
    tipping_transitions: {score: 0, rationale: "Brief describes 'zoning changes and post-crisis infrastructure hardening' as internal adaptive responses, not bifurcations or alternative stable states. No regime-shift mechanism, threshold estimate, or multi-stable behavior proposed for the functioning metropolis. Boundary rule 'alternative-stable-state-required': no alternative stable state documented."}
    emergence: {score: 3, rationale: "Cities described via formalized order parameters and macro-level effective laws (scaling exponents for infrastructure vs. population, agglomeration theory, urban land-use models, economic productivity scaling). These are used predictively/explanatorily by urban economists and planners. Micro-level simulation (tracking each resident/transaction) not how urban science operates. Multiple macro-theories (scaling laws, network models, bid-rent theory) necessary."}
  the-internet:
    criticality: {score: 0, rationale: "Brief describes network structure (ASes, BGP routing, physical layer, dual atomicity framework) but no scale-invariant event statistics or SOC/critical-point mechanism. Boundary rule 'events-not-structure': dual atomicity and network topology are structural, not dynamics-generated events. Routing instabilities are mentioned implicitly but no criticality claim made."}
    tipping_transitions: {score: 0, rationale: "No regime shift, bifurcation, or alternative stable state proposed for the TCP/IP global routing system as scoped. Boundary clarification rule explicitly cites 'BGP route-flap storms' as transient instability NOT constituting regime shift, and brief scopes to current modern Internet without claiming bistability in routing dynamics."}
    emergence: {score: 3, rationale: "Internet requires formalized graph-theoretic order parameters (degree distribution, clustering coefficient, hierarchy metrics, path length) to characterize and predict topology; traffic dynamics described via self-similarity and long-range dependence. These parameters independently measured and used predictively by network scientists. Macro-level description is essential; full micro-level packet-flow simulation not the primary study mode."}
  languages:
    criticality: {score: 0, rationale: "Brief mentions 'Zipf, entropy, network structure' corpus statistics for English exemplar. Zipf's law is static rank-size distribution of word frequencies, not scale-invariant event statistics generated by language dynamics. Boundary rule 'events-not-structure': rank-size distributions belong to static-cross-sectional properties, not events. No SOC or criticality mechanism proposed for language systems."}
    tipping_transitions: {score: 0, rationale: "Brief describes linguistic units and speakers but no bifurcation, alternative stable state, or regime-shift mechanism for language. No formal tipping-element inventory or threshold structure proposed. Language change occurs but not characterized as multi-stable regime shift with documented critical slowing down or early-warning signals."}
    emergence: {score: 3, rationale: "Languages described via formalized order parameters (Zipf exponent, information-theoretic entropy, grammatical rules, network structure of phonemic/semantic relations) that are independently measured and predictively used by linguists. Macro-linguistic regularities (phonology, morphosyntax, lexical frequency distributions) not transparent from speaker behavior by inspection. Macro-level description is primary and essential; cannot be reduced to individual speaker cognition (out-of-scope per scoping note)."}
