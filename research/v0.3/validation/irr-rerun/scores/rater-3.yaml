rater: rater-3
tier: opus
date: 2026-07-16
packet_note: >
  The five briefs as provided contain only the header, exemplar list, and
  scoping note — no per-column evidence sections. Scores below are anchored
  judgments against ONLY that packet text (blindness rules prohibit
  supplementing from repository files, web, or model knowledge, and the
  criticality anchor's published-claim-required rule explicitly bars
  rater-side inference from adjacent knowledge). Where the packet reports
  no relevant claim, the anchor level-0 definitions ("no ... reported or
  sought") apply rather than "unknown," per the prefer-scoring instruction.
scores:
  stars:
    criticality: {score: 0, rationale: "The packet reports no scale-invariant event statistics and no SOC/critical-point claim for the star (granulation, sunspots, and the activity cycle are named only as structural/dynamical features). Under published-claim-required a rater may not import flare-statistics knowledge from outside the packet, so level 0 ('no scale-invariant event statistics reported or sought') applies."}
    tipping_transitions: {score: 0, rationale: "No regime shift, bifurcation, or multi-stable behavior is proposed in the packet; the only qualitative-state changes mentioned (subgiant/red giant/AGB evolutionary stages) are explicitly excluded by the scoping note as context, not scored dynamics. Level 0 applies."}
    emergence: {score: 2, rationale: "The packet describes recognizable macro-patterns with pattern-specific vocabulary — granulation 'cells', sunspots, the magnetic activity cycle, the convective-dynamo system — not obvious from plasma micro-rules. But no formalized order parameter or macro-law with quantitative content appears in the packet, so effective-theory-quality-gates-3 holds it at 2."}
  river-networks:
    criticality: {score: 0, rationale: "The only scale-related evidence in the packet is Horton's laws / Strahler ordering, which is static structural scaling and per events-not-structure contributes nothing here; Hurst long-range dependence is a temporal-correlation property, not scale-invariant event statistics. No event-statistics or SOC claim for the scoped system appears, so level 0."}
    tipping_transitions: {score: 2, rationale: "The packet presents avulsion as a concrete regime-shift mechanism: the Mississippi's engineered near-avulsion at the Old River Control Structure is stated to make this column 'concretely citable,' and a citable delta lobe-switching period is noted. Channel avulsion is a shift to an alternative persistent course, satisfying alternative-stable-state-required; one named, citable mechanism without a systematic inventory is exactly the single-modeled-mechanism-is-2 boundary rule, so 2 not 1 or 3."}
    emergence: {score: 3, rationale: "The packet identifies the dendritic network as a self-organized transport structure whose characteristic dynamics operate at the level where Horton's laws and Strahler ordering apply — named, formalized macro-level laws with measured quantitative content used by the field, not mere pattern vocabulary. That matches level 3's 'formalized macro-level effective law doing real explanatory work'; nothing in the packet supports level 4's multiple field-defining macro-theories."}
  cities:
    criticality: {score: 0, rationale: "The packet's only scale-invariance evidence is the Zipf rank-size law across cities, which is a static cross-instance distribution excluded by both events-not-structure and events-of-the-scoped-system (the scoped system is one metropolis, and rank-size across the urban system is not its own event dynamics). No event-statistics or SOC claim for the scoped city appears, so level 0."}
    tipping_transitions: {score: 0, rationale: "The packet proposes no regime shift, bifurcation, or alternative stable state for the city; 'post-crisis infrastructure hardening' is adaptation, not bistability. Even informal tipping-point language is absent from the packet, so level 0 rather than 1."}
    emergence: {score: 3, rationale: "The packet names urban scaling laws (plus land use and commuting structure) as the city's characteristic dynamics operating above the resident/building micro-level — a formalized macro-level regularity used explanatorily by the field, not readable off individual agents. Level 3; the packet gives no evidence of the multiple load-bearing macro-theories level 4 requires."}
  the-internet:
    criticality: {score: 0, rationale: "The packet's structural claims (scale-free-adjacent AS degree distribution) are explicitly out of scope per the anchor notes ('static scale-free network TOPOLOGY... belongs under degree_distribution'), and traffic self-similarity is a temporal-correlation property of the signal, not scale-invariant event statistics. No event-statistics or SOC claim appears in the packet, so level 0."}
    tipping_transitions: {score: 0, rationale: "The packet documents no bifurcation or alternative stable state; the boundary rules would in any case exclude transient episodes (route-flap storms) and predecessor-system events (NSFNET 1986), and the packet does not even raise these. Level 0."}
    emergence: {score: 2, rationale: "The packet describes a genuinely bi-layered macro-description (AS-level graph structure vs. self-similar traffic signal) with pattern-specific vocabulary practitioners use, which is more than bookkeeping aggregation. But it presents no formalized order-parameter theory with quantitative predictive content — the layer descriptions are scoping/morphological — so effective-theory-quality-gates-3 holds it at 2."}
  languages:
    criticality: {score: 0, rationale: "The packet's quantitative regularities (Zipf, entropy, co-occurrence network structure) are static distributional/structural properties of the corpus, excluded by events-not-structure; no scale-invariant EVENT statistics (e.g., of change events) or SOC/critical-point mechanism is claimed in the packet. Level 0."}
    tipping_transitions: {score: 0, rationale: "The packet mentions diachronic change of linguistic units but proposes no regime shift, threshold, bifurcation, or alternative stable state for the language; even informal tipping language is absent. Level 0."}
    emergence: {score: 3, rationale: "The packet frames the language as a population-level shared code whose structure (phonemes/morphemes/constructions and the statistical regularities over them, including Zipf and entropy laws) is the actual object of quantitative study, distributed across speakers and not readable off any individual — formalized macro-descriptive machinery doing the field's explanatory work, matching level 3. The packet does not itself establish level 4's 'multiple field-defining macro-laws as the primary mode,' so held at 3."}
